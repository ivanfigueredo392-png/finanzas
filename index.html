<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Finanzas · Ivan & Noelia</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;overflow-x:hidden;max-width:100vw;font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased}

/* ── PALETTE ── */
:root{
  --bg:#F0F4FF;--surface:#FFFFFF;--surface2:#F8FAFF;
  --border:#E2E8F0;--border2:#CBD5E1;--light:#F1F5F9;
  --text:#1A1B2E;--muted:#64748B;--r:12px;--r2:16px;
  --sh:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --sh2:0 4px 20px rgba(0,0,0,.1),0 2px 8px rgba(0,0,0,.06);
  --indigo:#4F46E5;--indigo-lt:#EEF2FF;--indigo-md:#C7D2FE;
  --green:#10B981;--green-lt:#ECFDF5;--green-md:#A7F3D0;
  --red:#EF4444;--red-lt:#FEF2F2;
  --amber:#F59E0B;--amber-lt:#FFFBEB;
  --blue:#3B82F6;--blue-lt:#EFF6FF;--blue-md:#BFDBFE;
  --purple:#8B5CF6;--purple-lt:#F5F3FF;
  --ivan:#3B82F6;--noelia:#8B5CF6;
  --gold:#D97706;--gold-lt:#FEF3C7;
}
body.dark{
  --bg:#0F172A;--surface:#1E293B;--surface2:#263148;
  --border:#334155;--border2:#475569;--light:#1E293B;
  --text:#E2E8F0;--muted:#64748B;
  --indigo:#818CF8;--indigo-lt:#1E1B4B;--indigo-md:#312E81;
  --green:#34D399;--green-lt:#022C22;--green-md:#064E3B;
  --red:#F87171;--red-lt:#2D0707;
  --amber:#FCD34D;--amber-lt:#1C1200;
  --blue:#60A5FA;--blue-lt:#0C1A35;--blue-md:#1E3A5F;
  --purple:#A78BFA;--purple-lt:#1E1040;
  --ivan:#60A5FA;--noelia:#A78BFA;
  --gold:#FCD34D;--gold-lt:#1C1200;
}
body{background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;transition:background .25s,color .25s}

/* ── PIN LOCK ── */
#pin{position:fixed;inset:0;z-index:9999;background:#0F172A;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0}
#pin.hide{display:none}
.pin-logo{font-size:26px;font-weight:700;color:#818CF8;margin-bottom:4px}
.pin-sub{font-size:12px;color:#475569;margin-bottom:28px}
.pin-dots{display:flex;gap:12px;margin-bottom:20px}
.pin-dot{width:13px;height:13px;border-radius:50%;border:2px solid #818CF8;background:transparent;transition:background .15s}
.pin-dot.on{background:#818CF8}
.pin-err{font-size:11px;color:#F87171;height:16px;text-align:center;margin-bottom:10px}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:220px}
.pkey{background:#1E293B;border:1px solid #334155;border-radius:12px;color:#E2E8F0;font-size:20px;font-weight:300;padding:15px;cursor:pointer;font-family:'Inter',sans-serif;transition:background .12s;text-align:center}
.pkey:active{background:#334155}

/* ── SYNC BAR ── */
#syncBar{position:fixed;top:0;left:0;right:0;z-index:500;padding:6px 16px;font-size:11px;font-weight:600;text-align:center;transition:all .3s;transform:translateY(-100%)}
#syncBar.show{transform:translateY(0)}
#syncBar.saving{background:#FEF3C7;color:#D97706}
#syncBar.ok{background:#ECFDF5;color:#10B981}
#syncBar.error{background:#FEF2F2;color:#EF4444}

/* ── HEADER ── */
.hdr{background:var(--surface);border-bottom:1px solid var(--border);padding:44px 14px 0;position:sticky;top:0;z-index:100;box-shadow:var(--sh)}
.hdr-row1{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px;overflow:hidden}
.hdr-title{font-size:20px;font-weight:700;color:var(--indigo);letter-spacing:-.3px;white-space:nowrap}
.hdr-sub{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:5px;margin-top:1px;white-space:nowrap}
.hdr-right{display:flex;align-items:center;gap:4px;flex-shrink:0;min-width:0}
.dark-btn{background:var(--light);border:1px solid var(--border);border-radius:20px;width:28px;height:28px;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mini-chips{display:flex;gap:3px;min-width:0}
.chip{border-radius:7px;padding:3px 6px;text-align:center;min-width:0;flex:1}
.chip-lbl{font-size:7px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;margin-bottom:1px;white-space:nowrap}
.chip-val{font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mes-row{display:flex;gap:8px;margin-bottom:10px;width:100%}
.sel{flex:1;min-width:0;background:var(--light);border:1px solid var(--border);border-radius:var(--r);padding:7px 8px;font-size:12px;color:var(--text);font-family:'Inter',sans-serif;cursor:pointer;outline:none;width:100%}
.tabs{display:flex;overflow-x:auto;scrollbar-width:none;border-bottom:none;margin:0 -14px;padding:0 14px;gap:0}
.tabs::-webkit-scrollbar{display:none}
.tb{flex-shrink:0;padding:9px 10px;background:none;border:none;border-bottom:2.5px solid transparent;font-family:'Inter',sans-serif;font-size:10px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap;text-transform:uppercase;letter-spacing:.3px;transition:all .18s}
.tb.on{color:var(--indigo);border-bottom-color:var(--indigo)}

/* ── CONTENT ── */
.cnt{padding:12px;max-width:100%;width:100%;margin:0 auto;box-sizing:border-box;overflow-x:hidden}

/* ── CARDS ── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);padding:13px;margin-bottom:10px;box-shadow:var(--sh);overflow:hidden;width:100%;box-sizing:border-box;min-width:0}
.card-title{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:10px}

/* ── HERO CARDS ── */
.hero{border-radius:var(--r2);padding:14px;margin-bottom:12px;box-shadow:var(--sh2);color:#fff;min-width:0;overflow:hidden}
.hero-lbl{font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:rgba(255,255,255,.6);margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero-amt{font-size:22px;font-weight:700;letter-spacing:-.5px;line-height:1.1;font-family:'JetBrains Mono',monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hero-sub{font-size:9px;color:rgba(255,255,255,.55);margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ── STATS ── */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:10px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);padding:10px;box-shadow:var(--sh);min-width:0;overflow:hidden}
.stat-lbl{font-size:9px;color:var(--muted);font-weight:500;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stat-val{font-size:13px;font-weight:700;font-family:'JetBrains Mono',monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ── ITEMS ── */
.item{display:flex;align-items:center;gap:5px;padding:8px 9px;border-radius:var(--r);border:1px solid var(--border);margin-bottom:5px;background:var(--surface);box-shadow:var(--sh);width:100%;box-sizing:border-box;overflow:hidden;min-width:0}
.item.gray{background:var(--light);border-color:var(--border)}
.item-l{flex:1;min-width:0;overflow:hidden}
.item-desc{font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.item-sub{font-size:9px;color:var(--muted);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item-r{display:flex;align-items:center;gap:3px;flex-shrink:0;max-width:50%}
.amt{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:90px}

/* ── BUTTONS ── */
.btn{width:100%;padding:11px;border-radius:var(--r);font-family:'Inter',sans-serif;font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all .15s}
.btn-ind{background:var(--indigo);color:#fff}
.btn-grn{background:var(--green);color:#fff}
.btn-red{background:var(--red);color:#fff}
.btn-blu{background:var(--blue);color:#fff}
.btn-amb{background:var(--amber);color:#fff}
.btn-ghost{background:var(--light);color:var(--text);border:1px solid var(--border)}
.check-btn{width:26px;height:26px;min-width:26px;border-radius:50%;border:2px solid;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;transition:all .18s;flex-shrink:0}
.ebtn{min-width:26px;height:26px;border-radius:7px;background:var(--light);border:1px solid var(--border);color:var(--muted);font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.idel{min-width:26px;height:26px;border-radius:7px;background:var(--red-lt);border:1px solid #FCA5A5;color:var(--red);font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.idel:active{background:var(--red);color:#fff}
.medio-btn{padding:8px;border-radius:var(--r);font-family:'Inter',sans-serif;font-size:11px;font-weight:600;cursor:pointer;border:2px solid var(--border);background:var(--surface);color:var(--muted);transition:all .15s;width:100%}
.medio-btn.active-blue{border-color:var(--blue);background:var(--blue-lt);color:var(--blue)}
.medio-btn.active-amber{border-color:var(--amber);background:var(--amber-lt);color:var(--amber)}
.medio-btn.active-ind{border-color:var(--indigo);background:var(--indigo-lt);color:var(--indigo)}
.medio-btn.active-grn{border-color:var(--green);background:var(--green-lt);color:var(--green)}

/* ── FORMS ── */
.fg{margin-bottom:8px;width:100%}
.finp{width:100%;background:var(--light);border:1px solid var(--border);border-radius:var(--r);padding:9px 10px;font-size:13px;color:var(--text);font-family:'Inter',sans-serif;outline:none;transition:border .15s;box-sizing:border-box}
.finp:focus{border-color:var(--indigo)}
.fsel{width:100%;background:var(--light);border:1px solid var(--border);border-radius:var(--r);padding:9px 10px;font-size:13px;color:var(--text);font-family:'Inter',sans-serif;outline:none;cursor:pointer;box-sizing:border-box}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;box-sizing:border-box}
.hint{font-size:10px;color:var(--muted);margin-bottom:10px}

/* ── PROGRESS ── */
.prog{height:6px;background:var(--light);border-radius:3px;overflow:hidden;margin:4px 0}
.prog-fill{height:100%;border-radius:3px;transition:width .3s}
.dr{display:flex;justify-content:space-between;align-items:center;padding:5px 0;font-size:12px}
.dr.bold{font-weight:700;padding-top:8px;border-top:1px solid var(--border);margin-top:4px}
.lbl{color:var(--muted);flex:1}
.val{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600}
.divider{border:none;border-top:1px solid var(--border);margin:8px 0}

/* ── BADGES ── */
.badge{display:inline-flex;align-items:center;padding:2px 7px;border-radius:20px;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.badge-grn{background:var(--green-lt);color:var(--green)}
.badge-red{background:var(--red-lt);color:var(--red)}
.badge-amb{background:var(--amber-lt);color:var(--amber)}
.badge-blu{background:var(--blue-lt);color:var(--blue)}
.badge-muted{background:var(--light);color:var(--muted)}

/* ── CATEGORY DOTS ── */
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px;flex-shrink:0}

/* ── MODAL ── */
#modal{position:fixed;inset:0;z-index:800;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.45);backdrop-filter:blur(3px)}
#modal.hide{display:none}
.modal-sheet{background:var(--surface);border-radius:20px 20px 0 0;padding:20px;width:100%;max-width:500px;max-height:88vh;overflow-y:auto;box-shadow:0 -8px 40px rgba(0,0,0,.15)}
.modal-handle{width:36px;height:4px;background:var(--border2);border-radius:2px;margin:0 auto 16px}
.modal-title{font-size:14px;font-weight:700;color:var(--text);margin-bottom:16px}
.modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}

/* ── TC FILE UPLOAD ── */
.upload-zone{border:2px dashed var(--border2);border-radius:var(--r2);padding:24px;text-align:center;cursor:pointer;transition:all .2s}
.upload-zone:hover{border-color:var(--indigo);background:var(--indigo-lt)}
.upload-zone input{display:none}
#tc-preview{width:100%;border-radius:var(--r);margin-top:10px;display:none;max-height:400px;object-fit:contain}
#tc-preview-pdf{width:100%;height:400px;border:none;border-radius:var(--r);margin-top:10px;display:none}

/* ── RESPONSIVE ── */
@media(min-width:600px){.cnt{padding:20px}.card{padding:18px}.tb{font-size:11px;padding:11px 14px}.stat-val{font-size:16px}}
@media(min-width:900px){.cnt{padding:24px 0}.hdr{padding:44px 32px 0}}

/* ── LOADING ── */
.loading{display:flex;align-items:center;justify-content:center;gap:10px;padding:40px;color:var(--muted);font-size:13px}
.spin{width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--indigo);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ── SECTION HEADER ── */
.sec-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.sec-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.cat-bar{width:100%;height:4px;background:var(--light);border-radius:2px;margin:4px 0 10px;overflow:hidden}
.cat-bar-fill{height:100%;border-radius:2px}

/* ── AHORRO ── */
.sav-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.sav-box{background:var(--light);border-radius:var(--r2);padding:12px}
.sav-lbl{font-size:9px;font-weight:700;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.sav-input{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:8px 10px;font-size:15px;font-weight:600;font-family:'JetBrains Mono',monospace;color:var(--text);text-align:center;outline:none}

/* ── DESTINOS ── */
.dest-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)}
.dest-row:last-child{border-bottom:none}

/* ── PAGE ── */
.page{display:none}.page.on{display:block}
</style>
</head>
<body>

<!-- PIN LOCK -->
<div id="pin">
  <div class="pin-logo">Finanzas</div>
  <div class="pin-sub">Ivan & Noelia · ingresá tu PIN</div>
  <div class="pin-dots">
    <div class="pin-dot" id="pd0"></div><div class="pin-dot" id="pd1"></div>
    <div class="pin-dot" id="pd2"></div><div class="pin-dot" id="pd3"></div>
    <div class="pin-dot" id="pd4"></div><div class="pin-dot" id="pd5"></div>
  </div>
  <div class="pin-err" id="pinErr"></div>
  <div class="pin-pad">
    <button class="pkey" onclick="pk('1')">1</button><button class="pkey" onclick="pk('2')">2</button><button class="pkey" onclick="pk('3')">3</button>
    <button class="pkey" onclick="pk('4')">4</button><button class="pkey" onclick="pk('5')">5</button><button class="pkey" onclick="pk('6')">6</button>
    <button class="pkey" onclick="pk('7')">7</button><button class="pkey" onclick="pk('8')">8</button><button class="pkey" onclick="pk('9')">9</button>
    <button class="pkey" style="font-size:16px" onclick="pkdel()">⌫</button><button class="pkey" onclick="pk('0')">0</button><button class="pkey" style="font-size:16px;color:#818CF8" onclick="pksubmit()">✓</button>
  </div>
</div>

<!-- EDIT MODAL -->
<div id="modal" class="hide">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title" id="modal-title">Editar</div>
    <div class="fg"><label style="font-size:9px;font-weight:700;text-transform:uppercase;color:var(--muted);margin-bottom:4px;display:block">Descripción</label><input class="finp" id="em-desc"></div>
    <div class="fg"><label style="font-size:9px;font-weight:700;text-transform:uppercase;color:var(--muted);margin-bottom:4px;display:block">Monto $</label><input class="finp" id="em-monto" type="number"></div>
    <div class="fg"><label style="font-size:9px;font-weight:700;text-transform:uppercase;color:var(--muted);margin-bottom:4px;display:block">Categoría</label><select class="fsel" id="em-cat"></select></div>
    <div class="fg" id="em-persona-row"><label style="font-size:9px;font-weight:700;text-transform:uppercase;color:var(--muted);margin-bottom:4px;display:block">Persona</label>
      <div class="frow"><button class="medio-btn" id="em-ivan-btn" onclick="emPersona('Ivan')">👤 Ivan</button><button class="medio-btn" id="em-noelia-btn" onclick="emPersona('Noelia')">👤 Noelia</button></div></div>
    <div class="fg" id="em-medio-row"><label style="font-size:9px;font-weight:700;text-transform:uppercase;color:var(--muted);margin-bottom:4px;display:block">Medio</label>
      <div class="frow"><button class="medio-btn" id="em-banco-btn" onclick="emMedio('banco')">🏦 Banco</button><button class="medio-btn" id="em-efec-btn" onclick="emMedio('efectivo')">💵 Efectivo</button></div></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-ind" onclick="saveModal()">✓ Guardar</button>
    </div>
  </div>
</div>

<!-- SYNC BAR -->
<div id="syncBar"></div>

<!-- HEADER -->
<div class="hdr">
  <div class="hdr-row1">
    <div>
      <div class="hdr-title">Finanzas</div>
      <div class="hdr-sub">Ivan & Noelia · <span id="syncDot" style="color:var(--muted)">conectando...</span></div>
    </div>
    <div class="hdr-right">
      <button id="darkBtn" class="dark-btn" onclick="toggleDark()">🌙</button>
      <div class="mini-chips">
        <div class="chip" style="background:var(--green-lt);border:1px solid var(--green-md)">
          <div class="chip-lbl" style="color:var(--green)">Banco</div>
          <div class="chip-val" id="chip-banco" style="color:var(--green)">-</div>
        </div>
        <div class="chip" style="background:var(--amber-lt);border:1px solid #FCD34D">
          <div class="chip-lbl" style="color:var(--amber)">Efec.</div>
          <div class="chip-val" id="chip-efec" style="color:var(--amber)">-</div>
        </div>
      </div>
    </div>
  </div>
  <div class="mes-row">
    <select id="selMes" class="sel">
      <option value="0">Enero</option><option value="1">Febrero</option><option value="2">Marzo</option>
      <option value="3">Abril</option><option value="4">Mayo</option><option value="5">Junio</option>
      <option value="6">Julio</option><option value="7">Agosto</option><option value="8">Septiembre</option>
      <option value="9">Octubre</option><option value="10">Noviembre</option><option value="11">Diciembre</option>
    </select>
    <select id="selAnio" class="sel"><option value="2024">2024</option><option value="2025">2025</option><option value="2026">2026</option></select>
  </div>
  <div class="tabs">
    <button class="tb on" data-tab="resumen">📊 Resumen</button>
    <button class="tb" data-tab="ingresos">💰 Ingresos</button>
    <button class="tb" data-tab="egr-banco">🏦 Egr.Banco</button>
    <button class="tb" data-tab="egr-efec">💵 Egr.Efec.</button>
    <button class="tb" data-tab="ahorro">🏦 Ahorro</button>
    <button class="tb" data-tab="tc">💳 TC</button>
    <button class="tb" data-tab="ajustes">⚙️ Ajustes</button>
  </div>
</div>

<!-- PAGES -->
<div class="cnt" id="mainCnt">
  <div id="page-resumen"   class="page on"><div class="loading"><div class="spin"></div>Cargando...</div></div>
  <div id="page-ingresos"  class="page"></div>
  <div id="page-egr-banco" class="page"></div>
  <div id="page-egr-efec"  class="page"></div>
  <div id="page-ahorro"    class="page"></div>
  <div id="page-tc"        class="page"></div>
  <div id="page-ajustes"   class="page"></div>
</div>

<script type="module">
import {initializeApp}             from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
import {getDatabase,ref,set,onValue} from "https://www.gstatic.com/firebasejs/11.0.1/firebase-database.js";

// ── CONFIG ──────────────────────────────────────────────────────────

}

// ── CALCULAR SALDOS ──────────────────────────────────────────────────
function calcSaldos(){
  const ingM=D.ingresos.filter(i=>i.mes===mes&&i.anio===anio);
  const gasM=D.gastos.filter(g=>g.mes===mes&&g.anio===anio);
  const tcM =D.tarjetas.filter(t=>t.mes===mes&&t.anio===anio);

  // Ingresos
  const totIng   =ingM.reduce((s,i)=>s+i.monto,0);
  const totIngConf=ingM.filter(i=>i.confirmado).reduce((s,i)=>s+i.monto,0);
  const ingBanco =ingM.filter(i=>(i.medio||"banco")==="banco").reduce((s,i)=>s+i.monto,0);
  const ingEfec  =ingM.filter(i=>i.medio==="efectivo").reduce((s,i)=>s+i.monto,0);
  const ingBancoConf=ingM.filter(i=>i.confirmado&&(i.medio||"banco")==="banco").reduce((s,i)=>s+i.monto,0);
  const ingEfecConf =ingM.filter(i=>i.confirmado&&i.medio==="efectivo").reduce((s,i)=>s+i.monto,0);

  // Egresos
  const gasBanco=gasM.filter(g=>(g.medio||"banco")==="banco");
  const gasEfec =gasM.filter(g=>g.medio==="efectivo");
  const totGas  =gasM.reduce((s,g)=>s+g.monto,0);
  const gasBancoPag=gasBanco.filter(g=>g.pagado).reduce((s,g)=>s+g.monto,0);
  const gasEfecPag =gasEfec.filter(g=>g.pagado).reduce((s,g)=>s+g.monto,0);
  const totGasPag  =gasBancoPag+gasEfecPag;

  // TC
  const totTC=tcM.reduce((s,t)=>s+(t.total||0),0);

  // Ahorros SOLO del mes actual (no acumulado)
  const savMes=D.ahorros[key(mes,anio)]||{principal:0,secundario:0,medioP:"banco",medioS:"efectivo"};
  const totSavMes=(savMes.principal||0)+(savMes.secundario||0);
  const ahorrosBancoMes=((savMes.medioP||"banco")==="banco"?(savMes.principal||0):0)
    +((savMes.medioS||"efectivo")==="banco"?(savMes.secundario||0):0);
  const ahorrosEfecMes=((savMes.medioP||"banco")==="efectivo"?(savMes.principal||0):0)
    +((savMes.medioS||"efectivo")==="efectivo"?(savMes.secundario||0):0);

  // Ahorros acumulados históricos (para mostrar en Ahorro, no para disponible del mes)
  let ahorroBanco=0,ahorroEfec=0;
  Object.values(D.ahorros||{}).forEach(s=>{
    if((s.medioP||"banco")==="banco") ahorroBanco+=(s.principal||0); else ahorroEfec+=(s.principal||0);
    if((s.medioS||"efectivo")==="efectivo") ahorroEfec+=(s.secundario||0); else ahorroBanco+=(s.secundario||0);
  });

  // Billetera efectivo (acumulada)
  const movsEfec=D.efectivo||[];
  const efecEnt=movsEfec.filter(m=>m.tipo==="entrada").reduce((s,m)=>s+m.monto,0);
  const efecSal=movsEfec.filter(m=>m.tipo==="salida").reduce((s,m)=>s+m.monto,0);
  const efecBruto=efecEnt-efecSal;

  // ✅ Disponibles corregidos — usan SOLO el mes actual
  const dispBanco=ingBancoConf-gasBancoPag-totTC-ahorrosBancoMes;
  const dispEfec=efecBruto-ahorrosEfecMes;

  const catMap={};
  gasM.forEach(g=>{catMap[g.cat]=(catMap[g.cat]||0)+g.monto;});
  tcM.forEach(t=>{catMap["TC"]=(catMap["TC"]||0)+(t.total||0);});
  const cats=Object.entries(catMap).sort((a,b)=>b[1]-a[1]);

  return{ingM,gasM,gasBanco,gasEfec,tcM,
    totIng,totIngConf,ingBanco,ingEfec,ingBancoConf,ingEfecConf,
    totGas,gasBancoPag,gasEfecPag,totGasPag,totTC,
    savMes,totSavMes,ahorroBanco,ahorroEfec,ahorrosBancoMes,ahorrosEfecMes,
    efecBruto,efecEnt,efecSal,dispBanco,dispEfec,
    cats,pctMeta:META>0?Math.min((totSavMes/META)*100,100):0};
}

function eGroup(items, showMedio=true){
  if(!items.length) return `<p style="text-align:center;color:var(--muted);font-size:12px;padding:24px 0">Sin registros</p>`;
  const catMap={};
  items.forEach(g=>{if(!catMap[g.cat])catMap[g.cat]=[];catMap[g.cat].push(g);});
  const cats=Object.entries(catMap).sort((a,b)=>b[1].reduce((s,x)=>s+x.monto,0)-a[1].reduce((s,x)=>s+x.monto,0));
  return cats.map(([cat,gitems],idx)=>{
    const tot=gitems.reduce((s,x)=>s+x.monto,0);
    const color=COLORS[idx%COLORS.length];
    return `<div style="margin-bottom:14px">
      <div class="sec-head">
        <span class="sec-title" style="color:${color}"><span class="dot" style="background:${color}"></span>${cat}</span>
        <span style="font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;color:${color}">${fmt(tot)}</span>
      </div>
      ${gitems.map(g=>eItem(g,showMedio)).join("")}
    </div>`;
  }).join("");
}

  const maxV=Math.max(...last6.map(h=>Math.max(h.c.totIng,h.c.totGas+h.c.totTC)),1);
  const prevMes=mes>0?calcSaldos_for(mes-1,anio):calcSaldos_for(11,anio-1);

function calcSaldos_for(m,a){
  const ingM=D.ingresos.filter(i=>i.mes===m&&i.anio===a);
  const gasM=D.gastos.filter(g=>g.mes===m&&g.anio===a);
  const tcM=D.tarjetas.filter(t=>t.mes===m&&t.anio===a);
  const totIng=ingM.reduce((s,i)=>s+i.monto,0);
  const totGas=gasM.reduce((s,g)=>s+g.monto,0);
  const totTC=tcM.reduce((s,t)=>s+(t.total||0),0);
  const savMes=D.ahorros[key(m,a)]||{principal:0,secundario:0};
  const totSavMes=(savMes.principal||0)+(savMes.secundario||0);
  return{totIng,totGas,totTC,totSavMes};
}

window.addEfectivo=function(){
  const desc=document.getElementById("ef-desc").value.trim();

  if(!desc||isNaN(monto)||monto<=0)return;

  if(!D.efectivo)D.efectivo=[];
  D.efectivo.push({id:"ef"+Date.now(),desc,tipo:window._efTipo||"entrada",monto,persona,
    fecha:ts.toLocaleDateString("es-AR"),hora:ts.toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"})});

  const k=key(mes,anio);

  if(!D.ahorros[k].destinos)D.ahorros[k].destinos=[];
  D.ahorros[k][tipo]=Number(val)||0;
  save();updateChips();
}
window.setSavMedio=function(tipo,m){
  const k=key(mes,anio);
  if(!D.ahorros[k])D.ahorros[k]={principal:0,secundario:0,medioP:"banco",medioS:"efectivo",destinos:[]};
  D.ahorros[k][tipo]=m;
  save();rAhorro();
}
window.addDestino=function(){
  const tipo=document.getElementById("dest-tipo").value;
  const monto=parseFloat(document.getElementById("dest-monto").value);
  const nota=document.getElementById("dest-nota").value.trim();
  if(!tipo||isNaN(monto)||monto<=0)return;
  const k=key(mes,anio);
  if(!D.ahorros[k])D.ahorros[k]={principal:0,secundario:0,medioP:"banco",medioS:"efectivo",destinos:[]};
  if(!D.ahorros[k].destinos)D.ahorros[k].destinos=[];
  D.ahorros[k].destinos.push({tipo,monto,nota,fecha:new Date().toLocaleDateString("es-AR")});
  save();rAhorro();
}
window.delDestino=function(k,idx){
  if(!D.ahorros[k]||!D.ahorros[k].destinos)return;
  D.ahorros[k].destinos.splice(idx,1);
  save();rAhorro();
}

window.handleTCFile=function(e){
  const file=e.target.files[0];
  if(!file)return;
  document.getElementById("tc-file-name").textContent=file.name;
  const img=document.getElementById("tc-preview");
  const pdf=document.getElementById("tc-preview-pdf");
  if(file.type==="application/pdf"){
    img.style.display="none";
    pdf.src=URL.createObjectURL(file);
    pdf.style.display="block";
  } else {
    pdf.style.display="none";
    img.src=URL.createObjectURL(file);
    img.style.display="block";
  }
}

window.exportJSON=function(){
  const blob=new Blob([JSON.stringify(D,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`finanzas-${new Date().toLocaleDateString("es-AR").replace(/\//g,"-")}.json`;a.click();
}
window.importJSON=function(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();r.onload=ev=>{try{D=JSON.parse(ev.target.result);save();renderAll();}catch(ex){alert("Error al importar");}};r.readAsText(f);
}
window.crearBackup=function(){
  let bs=JSON.parse(localStorage.getItem("fi-backups")||"[]");
  bs.unshift({fecha:new Date().toLocaleString("es-AR"),data:JSON.stringify(D)});
  if(bs.length>10)bs=bs.slice(0,10);
  localStorage.setItem("fi-backups",JSON.stringify(bs));
  syncBar("ok","✓ Backup creado");rAjustes();
}
window.restoreBackup=function(i){
  const bs=JSON.parse(localStorage.getItem("fi-backups")||"[]");
  if(bs[i]){D=JSON.parse(bs[i].data);save();renderAll();}
}
window.delBackup=function(i){
  const bs=JSON.parse(localStorage.getItem("fi-backups")||"[]");
  bs.splice(i,1);localStorage.setItem("fi-backups",JSON.stringify(bs));rAjustes();
}
window.setPresCat=function(k,cat,val){
  if(!D.presupuestoCat)D.presupuestoCat={};
  if(!D.presupuestoCat[k])D.presupuestoCat[k]={};
  const n=parseFloat(val);
  if(!isNaN(n)&&n>0)D.presupuestoCat[k][cat]=n;
  else delete D.presupuestoCat[k][cat];
  save();
}
window.toggleConf=function(id){
  const i=D.ingresos.find(x=>x.id===id);if(!i)return;
  i.confirmado=!i.confirmado;
  if((i.medio||"banco")==="efectivo"){
    if(i.confirmado){
      if(!D.efectivo)D.efectivo=[];
      if(!D.efectivo.find(m=>m.ingId===id)){
        const ts=new Date();
        D.efectivo.push({id:"ef-ing-"+id,desc:`↑ ${i.desc} (${i.persona})`,tipo:"entrada",monto:i.monto,persona:i.persona,auto:true,ingId:id,fecha:i.fecha||ts.toLocaleDateString("es-AR")});
      }
    } else {
      D.efectivo=(D.efectivo||[]).filter(m=>m.ingId!==id);
    }
  }
  save();renderAll();
}
window.togglePago=function(id){
  const g=D.gastos.find(x=>x.id===id);if(!g)return;
  g.pagado=!g.pagado;
  const ts=new Date();
  if(g.pagado){
    g.fechaPago=ts.toLocaleDateString("es-AR");
    if((g.medio||"banco")==="efectivo"){
      if(!D.efectivo)D.efectivo=[];
      if(!D.efectivo.find(m=>m.gasId===id))
        D.efectivo.push({id:"ef-gas-"+id,desc:`↓ ${g.desc}`,tipo:"salida",monto:g.monto,auto:true,gasId:id,fecha:ts.toLocaleDateString("es-AR")});
    }
  } else {
    delete g.fechaPago;
    D.efectivo=(D.efectivo||[]).filter(m=>m.gasId!==id);
  }
  save();renderAll();
}
window.delIng=function(id){
  const sid=String(id);
  D.ingresos=D.ingresos.filter(i=>String(i.id)!==sid);
  D.efectivo=(D.efectivo||[]).filter(m=>String(m.ingId||"")!==sid);
  save();renderAll();
}
window.delGas=function(id){
  const sid=String(id);
  D.gastos=D.gastos.filter(g=>String(g.id)!==sid);
  D.efectivo=(D.efectivo||[]).filter(m=>String(m.gasId||"")!==sid);
  save();renderAll();
}
window.delEfectivo=function(id){
  D.efectivo=(D.efectivo||[]).filter(m=>String(m.id)!==String(id));
  save();rEfectivo();
}
let _mTipo=null,_mId=null,_mMedio="banco",_mPersona="Ivan";
window.openModal=function(tipo,id){
  let obj=null;
  if(tipo==="ing") obj=D.ingresos.find(i=>i.id===id);
  else if(tipo==="gas") obj=D.gastos.find(g=>g.id===id);
  else obj=(D.efectivo||[]).find(m=>m.id===id);
  if(!obj)return;
  _mTipo=tipo;_mId=id;_mMedio=obj.medio||"banco";_mPersona=obj.persona||"Ivan";
  document.getElementById("modal-title").textContent=tipo==="ing"?"✏️ Editar Ingreso":tipo==="gas"?"✏️ Editar Egreso":"✏️ Editar Movimiento";
  document.getElementById("em-desc").value=obj.desc||"";
  document.getElementById("em-monto").value=obj.monto||"";
  const cats=tipo==="ing"?ING_CATS.map(c=>c.label):tipo==="gas"?CAT_GAS:["Ingreso","Gasto","Retiro","Otros"];
  document.getElementById("em-cat").innerHTML=cats.map(c=>`<option ${c===(obj.cat||obj.desc)?"selected":""}>${c}</option>`).join("");
  document.getElementById("em-persona-row").style.display=(tipo==="ing"||tipo==="ef")?"block":"none";
  document.getElementById("em-medio-row").style.display=tipo==="ef"?"none":"block";
  emMedio(_mMedio);emPersona(_mPersona);
  document.getElementById("modal").classList.remove("hide");
}
window.closeModal=function(){document.getElementById("modal").classList.add("hide");_mTipo=null;}
window.saveModal=function(){
  if(!_mTipo||!_mId)return;
  const desc=document.getElementById("em-desc").value.trim();
  const monto=parseFloat(document.getElementById("em-monto").value);
  const cat=document.getElementById("em-cat").value;
  if(!desc||isNaN(monto)||monto<=0){closeModal();return;}
  if(_mTipo==="ing"){const i=D.ingresos.find(x=>x.id===_mId);if(i){i.desc=desc;i.monto=monto;i.cat=cat;i.persona=_mPersona;i.medio=_mMedio;}}
  else if(_mTipo==="gas"){const g=D.gastos.find(x=>x.id===_mId);if(g){g.desc=desc;g.monto=monto;g.cat=cat;g.medio=_mMedio;}}
  else{const m=(D.efectivo||[]).find(x=>x.id===_mId);if(m){m.desc=desc;m.monto=monto;m.persona=_mPersona;}}
  save();closeModal();renderAll();
}
window.emMedio=function(m){_mMedio=m;const bb=document.getElementById("em-banco-btn"),be=document.getElementById("em-efec-btn");if(bb)bb.className="medio-btn"+(m==="banco"?" active-blue":"");if(be)be.className="medio-btn"+(m==="efectivo"?" active-amber":"");}
window.emPersona=function(p){_mPersona=p;const bi=document.getElementById("em-ivan-btn"),bn=document.getElementById("em-noelia-btn");if(bi)bi.className="medio-btn"+(p==="Ivan"?" active-ind":"");if(bn)bn.className="medio-btn"+(p==="Noelia"?" active-ind":"");}
document.getElementById("modal").addEventListener("click",e=>{if(e.target===document.getElementById("modal"))closeModal();});

const PIN="130221";let pinIn="";
window.pk=function(d){pinIn+=d;updDots();if(pinIn.length===6)pksubmit();}
window.pkdel=function(){pinIn=pinIn.slice(0,-1);updDots();}
window.pksubmit=function(){
  if(pinIn===PIN){document.getElementById("pin").classList.add("hide");}
  else{document.getElementById("pinErr").textContent="PIN incorrecto";pinIn="";updDots();setTimeout(()=>{document.getElementById("pinErr").textContent="";},1500);}
}
function updDots(){for(let i=0;i<6;i++)document.getElementById("pd"+i).classList.toggle("on",i<pinIn.length);}

window.toggleDark=function(){
  const d=document.body.classList.toggle("dark");
  document.getElementById("darkBtn").textContent=d?"☀️":"🌙";
  localStorage.setItem("fi-dark",d?"1":"0");
}
if(localStorage.getItem("fi-dark")==="1"){document.body.classList.add("dark");document.getElementById("darkBtn").textContent="☀️";}

const TAB_ORDER=["resumen","ingresos","egr-banco","egr-efec","ahorro","tc","ajustes"];

function goTab(tab){
  document.querySelectorAll(".tb").forEach(b=>{b.classList.toggle("on",b.dataset.tab===tab);});
  tabAct=tab;
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("on"));
  const pg=document.getElementById("page-"+tab);if(pg)pg.classList.add("on");
  document.querySelector(`.tb[data-tab="${tab}"]`)?.scrollIntoView({behavior:"smooth",block:"nearest",inline:"center"});
  renderAll();
}

function renderAll(){
  updateChips();
  if(tabAct==="resumen")       rResumen();
  else if(tabAct==="ingresos")  rIngresos();
  else if(tabAct==="egr-banco") rEgrBanco();
  else if(tabAct==="egr-efec")  rEgrEfec();
  else if(tabAct==="ahorro")    rAhorro();
  else if(tabAct==="tc")        rTC();
  else if(tabAct==="ajustes")   rAjustes();
}

document.querySelectorAll(".tb").forEach(btn=>{btn.addEventListener("click",()=>goTab(btn.dataset.tab));});

// ── SWIPE ──────────────────────────────────────────────────────────────
let swX=null,swY=null;
const cnt=document.getElementById("mainCnt");
cnt.addEventListener("touchstart",e=>{swX=e.touches[0].clientX;swY=e.touches[0].clientY;},{passive:true});
cnt.addEventListener("touchend",e=>{
  if(swX===null)return;
  const dx=e.changedTouches[0].clientX-swX, dy=e.changedTouches[0].clientY-swY;
  swX=null;swY=null;
  if(Math.abs(dy)>Math.abs(dx)||Math.abs(dx)<55)return;
  const cur=TAB_ORDER.indexOf(tabAct);
  if(dx<-55&&cur<TAB_ORDER.length-1) goTab(TAB_ORDER[cur+1]);
  if(dx>55&&cur>0) goTab(TAB_ORDER[cur-1]);
},{passive:true});

document.getElementById("selMes").addEventListener("change",e=>{mes=Number(e.target.value);renderAll();});
document.getElementById("selAnio").addEventListener("change",e=>{anio=Number(e.target.value);renderAll();});
document.getElementById("selMes").value=mes;
document.getElementById("selAnio").value=anio;
const hoy=new Date().toDateString();
if(localStorage.getItem("fi-bk-date")!==hoy){
  setTimeout(()=>{if(D.ingresos&&D.ingresos.length>0){crearBackup();localStorage.setItem("fi-bk-date",hoy);}},8000);
}

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Finanzas · Ivan & Noelia</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;overflow-x:hidden;max-width:100vw;font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased}
:root{
  --bg:#F0F4FF;--surface:#FFFFFF;--surface2:#F8FAFF;
  --border:#E2E8F0;--border2:#CBD5E1;--light:#F1F5F9;
  --text:#1A1B2E;--muted:#64748B;--r:12px;--r2:16px;
  --sh:0 1px 3px rgba(0,0,0,.06);--sh2:0 4px 20px rgba(0,0,0,.1);
  --indigo:#4F46E5;--indigo-lt:#EEF2FF;
  --green:#10B981;--green-lt:#ECFDF5;--green-md:#A7F3D0;
  --red:#EF4444;--red-lt:#FEF2F2;
  --amber:#F59E0B;--amber-lt:#FFFBEB;
  --blue:#3B82F6;--blue-lt:#EFF6FF;
  --purple:#8B5CF6;--purple-lt:#F5F3FF;
  --ivan:#3B82F6;--noelia:#8B5CF6;
}
body.dark{
  --bg:#0F172A;--surface:#1E293B;--surface2:#263148;
  --border:#334155;--border2:#475569;--light:#283548;
  --text:#E2E8F0;--muted:#94A3B8;
  --indigo:#818CF8;--indigo-lt:#1E1B4B;
  --green:#34D399;--green-lt:#052E22;--green-md:#064E3B;
  --red:#F87171;--red-lt:#2D0F0F;
  --amber:#FBBF24;--amber-lt:#241A03;
  --blue:#60A5FA;--blue-lt:#0C1F3D;
  --purple:#A78BFA;--purple-lt:#1E1040;
  --ivan:#60A5FA;--noelia:#A78BFA;
}
body{background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;transition:background .25s}
#pin{position:fixed;inset:0;z-index:9999;background:#0F172A;display:flex;flex-direction:column;align-items:center;justify-content:center}
#pin.hide{display:none}
.pin-logo{font-size:26px;font-weight:700;color:#818CF8;margin-bottom:4px}
.pin-sub{font-size:12px;color:#475569;margin-bottom:28px}
.pin-dots{display:flex;gap:12px;margin-bottom:20px}
.pin-dot{width:13px;height:13px;border-radius:50%;border:2px solid #818CF8}
.pin-dot.on{background:#818CF8}
.pin-err{font-size:11px;color:#F87171;height:16px;margin-bottom:10px}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:220px}
.pkey{background:#1E293B;border:1px solid #334155;border-radius:12px;color:#E2E8F0;font-size:20px;padding:15px;cursor:pointer;font-family:'Inter',sans-serif;text-align:center}
.pkey:active{background:#334155}
#syncBar{position:fixed;top:0;left:0;right:0;z-index:500;padding:6px 16px;font-size:11px;font-weight:600;text-align:center;transition:transform .3s;transform:translateY(-100%)}
#syncBar.show{transform:translateY(0)}
#syncBar.saving{background:#FEF3C7;color:#D97706}
#syncBar.ok{background:#ECFDF5;color:#10B981}
#syncBar.error{background:#FEF2F2;color:#EF4444}
.hdr{background:var(--surface);border-bottom:1px solid var(--border);padding:44px 14px 0;position:sticky;top:0;z-index:100;box-shadow:var(--sh)}
.hdr-row1{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px}
.hdr-title{font-size:20px;font-weight:700;color:var(--indigo)}
.hdr-sub{font-size:11px;color:var(--muted);white-space:nowrap}
.hdr-right{display:flex;align-items:center;gap:4px;flex-shrink:0}
.dark-btn{background:var(--light);border:1px solid var(--border);border-radius:20px;width:28px;height:28px;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.mini-chips{display:flex;gap:3px}
.chip{border-radius:7px;padding:3px 6px;text-align:center}
.chip-lbl{font-size:7px;font-weight:700;text-transform:uppercase;margin-bottom:1px}
.chip-val{font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:700;white-space:nowrap}
.mes-row{display:flex;gap:8px;margin-bottom:10px}
.sel{flex:1;min-width:0;background:var(--light);border:1px solid var(--border);border-radius:var(--r);padding:7px 8px;font-size:12px;color:var(--text);font-family:'Inter',sans-serif;cursor:pointer;outline:none}
.tabs{display:flex;overflow-x:auto;scrollbar-width:none;margin:0 -14px;padding:0 14px}
.tabs::-webkit-scrollbar{display:none}
.tb{flex-shrink:0;padding:9px 10px;background:none;border:none;border-bottom:2.5px solid transparent;font-family:'Inter',sans-serif;font-size:10px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap;text-transform:uppercase;letter-spacing:.3px}
.tb.on{color:var(--indigo);border-bottom-color:var(--indigo)}
.cnt{padding:12px;max-width:100%;width:100%;margin:0 auto;overflow-x:hidden}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);padding:13px;margin-bottom:10px;box-shadow:var(--sh);overflow:hidden;width:100%;min-width:0}
.card-title{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:10px}
.hero{border-radius:var(--r2);padding:14px;margin-bottom:10px;box-shadow:var(--sh2);color:#fff;min-width:0;overflow:hidden}
.hero-lbl{font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:rgba(255,255,255,.65);margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero-amt{font-size:21px;font-weight:700;line-height:1.1;font-family:'JetBrains Mono',monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hero-sub{font-size:9px;color:rgba(255,255,255,.6);margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:10px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);padding:10px;box-shadow:var(--sh);min-width:0;overflow:hidden}
.stat-lbl{font-size:8px;color:var(--muted);font-weight:600;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase}
.stat-val{font-size:12px;font-weight:700;font-family:'JetBrains Mono',monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat-sub{font-size:8px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item{display:flex;align-items:center;gap:5px;padding:8px 9px;border-radius:var(--r);border:1px solid var(--border);margin-bottom:5px;background:var(--surface);box-shadow:var(--sh);width:100%;overflow:hidden;min-width:0}
.item.gray{background:var(--light)}
.item-l{flex:1;min-width:0;overflow:hidden}
.item-desc{font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item-sub{font-size:9px;color:var(--muted);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item-r{display:flex;align-items:center;gap:3px;flex-shrink:0;max-width:55%}
.amt{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:92px}
.btn{width:100%;padding:11px;border-radius:var(--r);font-family:'Inter',sans-serif;font-size:13px;font-weight:600;cursor:pointer;border:none}
.btn-ind{background:var(--indigo);color:#fff}
.btn-grn{background:var(--green);color:#fff}
.btn-blu{background:var(--blue);color:#fff}
.btn-amb{background:var(--amber);color:#fff}
.btn-pur{background:var(--purple);color:#fff}
.btn-red{background:var(--red);color:#fff}
.btn-ghost{background:var(--light);color:var(--text);border:1px solid var(--border)}
.check-btn{width:26px;height:26px;min-width:26px;border-radius:50%;border:2px solid;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;transition:all .18s}
.ebtn{min-width:26px;height:26px;border-radius:7px;background:var(--light);border:1px solid var(--border);color:var(--muted);font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.idel{min-width:26px;height:26px;border-radius:7px;background:var(--red-lt);border:1px solid #FCA5A5;color:var(--red);font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.medio-btn{padding:8px;border-radius:var(--r);font-family:'Inter',sans-serif;font-size:11px;font-weight:600;cursor:pointer;border:2px solid var(--border);background:var(--surface);color:var(--muted);width:100%}
.medio-btn.act-blue{border-color:var(--blue);background:var(--blue-lt);color:var(--blue)}
.medio-btn.act-amb{border-color:var(--amber);background:var(--amber-lt);color:var(--amber)}
.medio-btn.act-ind{border-color:var(--indigo);background:var(--indigo-lt);color:var(--indigo)}
.medio-btn.act-grn{border-color:var(--green);background:var(--green-lt);color:var(--green)}
.fg{margin-bottom:8px;width:100%}
.finp{width:100%;background:var(--light);border:1px solid var(--border);border-radius:var(--r);padding:9px 10px;font-size:13px;color:var(--text);font-family:'Inter',sans-serif;outline:none}
.finp:focus{border-color:var(--indigo)}
.fsel{width:100%;background:var(--light);border:1px solid var(--border);border-radius:var(--r);padding:9px 10px;font-size:13px;color:var(--text);font-family:'Inter',sans-serif;outline:none;cursor:pointer}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}
.flbl{font-size:9px;font-weight:600;color:var(--muted);display:block;margin-bottom:4px;text-transform:uppercase}
.prog{height:6px;background:var(--light);border-radius:3px;overflow:hidden;margin:4px 0}
.prog-fill{height:100%;border-radius:3px;transition:width .3s}
.dr{display:flex;justify-content:space-between;align-items:center;padding:5px 0;font-size:12px;gap:8px}
.dr.bold{font-weight:700;padding-top:8px;border-top:1px solid var(--border);margin-top:4px}
.lbl{color:var(--muted);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.val{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;flex-shrink:0}
.divider{border:none;border-top:1px solid var(--border);margin:8px 0}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px;flex-shrink:0}
#modal{position:fixed;inset:0;z-index:800;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.45)}
#modal.hide{display:none}
.modal-sheet{background:var(--surface);border-radius:20px 20px 0 0;padding:20px;width:100%;max-width:500px;max-height:88vh;overflow-y:auto}
.modal-handle{width:36px;height:4px;background:var(--border2);border-radius:2px;margin:0 auto 16px}
.modal-title{font-size:14px;font-weight:700;margin-bottom:16px}
.modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.page{display:none}.page.on{display:block}
.loading{display:flex;align-items:center;justify-content:center;gap:10px;padding:40px;color:var(--muted);font-size:13px}
.spin{width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--indigo);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media(min-width:600px){.cnt{padding:20px;max-width:560px}.tb{font-size:11px;padding:11px 14px}}
</style>
</head>
<body>
<div id="pin">
  <div class="pin-logo">Finanzas</div>
  <div class="pin-sub">Ivan &amp; Noelia · ingresa tu PIN</div>
  <div class="pin-dots">
    <div class="pin-dot" id="pd0"></div><div class="pin-dot" id="pd1"></div><div class="pin-dot" id="pd2"></div>
    <div class="pin-dot" id="pd3"></div><div class="pin-dot" id="pd4"></div><div class="pin-dot" id="pd5"></div>
  </div>
  <div class="pin-err" id="pinErr"></div>
  <div class="pin-pad">
    <button class="pkey" onclick="pk('1')">1</button><button class="pkey" onclick="pk('2')">2</button><button class="pkey" onclick="pk('3')">3</button>
    <button class="pkey" onclick="pk('4')">4</button><button class="pkey" onclick="pk('5')">5</button><button class="pkey" onclick="pk('6')">6</button>
    <button class="pkey" onclick="pk('7')">7</button><button class="pkey" onclick="pk('8')">8</button><button class="pkey" onclick="pk('9')">9</button>
    <button class="pkey" style="font-size:16px" onclick="pkdel()">⌫</button><button class="pkey" onclick="pk('0')">0</button><button class="pkey" style="font-size:16px;color:#818CF8" onclick="pksubmit()">✓</button>
  </div>
</div>
<div id="modal" class="hide">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title" id="m-title">Editar</div>
    <div class="fg"><label class="flbl">Descripción</label><input class="finp" id="m-desc"></div>
    <div class="fg"><label class="flbl">Monto $</label><input class="finp" id="m-monto" type="number"></div>
    <div class="fg" id="m-cat-row"><label class="flbl">Categoría</label><select class="fsel" id="m-cat"></select></div>
    <div class="fg" id="m-persona-row"><label class="flbl">Persona</label>
      <div class="frow"><button class="medio-btn" id="m-p1" onclick="mPersona(0)"></button><button class="medio-btn" id="m-p2" onclick="mPersona(1)"></button></div></div>
    <div class="fg" id="m-medio-row"><label class="flbl">Medio</label>
      <div class="frow"><button class="medio-btn" id="m-banco" onclick="mMedio('banco')">🏦 Banco</button><button class="medio-btn" id="m-efec" onclick="mMedio('efectivo')">💵 Efectivo</button></div></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-ind" onclick="saveModal()">✓ Guardar</button>
    </div>
  </div>
</div>
<div id="syncBar"></div>
<div class="hdr">
  <div class="hdr-row1">
    <div style="min-width:0">
      <div class="hdr-title">Finanzas</div>
      <div class="hdr-sub" id="hdr-nombres">Ivan &amp; Noelia · <span id="syncDot">conectando...</span></div>
    </div>
    <div class="hdr-right">
      <button id="darkBtn" class="dark-btn" onclick="toggleDark()">🌙</button>
      <div class="mini-chips">
        <div class="chip" style="background:var(--green-lt);border:1px solid var(--green-md)">
          <div class="chip-lbl" style="color:var(--green)">Banco</div>
          <div class="chip-val" id="chip-banco" style="color:var(--green)">-</div>
        </div>
        <div class="chip" style="background:var(--amber-lt);border:1px solid #FCD34D">
          <div class="chip-lbl" style="color:var(--amber)">Efec.</div>
          <div class="chip-val" id="chip-efec" style="color:var(--amber)">-</div>
        </div>
      </div>
    </div>
  </div>
  <div class="mes-row">
    <select id="selMes" class="sel">
      <option value="0">Enero</option><option value="1">Febrero</option><option value="2">Marzo</option>
      <option value="3">Abril</option><option value="4">Mayo</option><option value="5">Junio</option>
      <option value="6">Julio</option><option value="7">Agosto</option><option value="8">Septiembre</option>
      <option value="9">Octubre</option><option value="10">Noviembre</option><option value="11">Diciembre</option>
    </select>
    <select id="selAnio" class="sel"><option value="2024">2024</option><option value="2025">2025</option><option value="2026">2026</option><option value="2027">2027</option></select>
  </div>
  <div class="tabs">
    <button class="tb on" data-tab="resumen">📊 Resumen</button>
    <button class="tb" data-tab="ingresos">💰 Ingresos</button>
    <button class="tb" data-tab="egr-banco">🏦 Egr.Banco</button>
    <button class="tb" data-tab="egr-efec">💵 Egr.Efec.</button>
    <button class="tb" data-tab="tc">💳 TC</button>
    <button class="tb" data-tab="ahorro">🏦 Ahorro</button>
    <button class="tb" data-tab="config">⚙️ Config</button>
  </div>
</div>
<div class="cnt" id="mainCnt">
  <div id="page-resumen"   class="page on"><div class="loading"><div class="spin"></div>Cargando...</div></div>
  <div id="page-ingresos"  class="page"></div>
  <div id="page-egr-banco" class="page"></div>
  <div id="page-egr-efec"  class="page"></div>
  <div id="page-tc"        class="page"></div>
  <div id="page-ahorro"    class="page"></div>
  <div id="page-config"    class="page"></div>
</div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
import {getDatabase,ref,set,onValue} from "https://www.gstatic.com/firebasejs/11.0.1/firebase-database.js";

const FB={apiKey:"AIzaSyBe5XYEcquhv9lRAz1Ie34syeiwPpr5nD8",authDomain:"presupuesto-familiar-f758d.firebaseapp.com",databaseURL:"https://presupuesto-familiar-f758d-default-rtdb.firebaseio.com",projectId:"presupuesto-familiar-f758d",storageBucket:"presupuesto-familiar-f758d.firebasestorage.app",messagingSenderId:"522035317903",appId:"1:522035317903:web:38e1ae5758ff772eac34fa"};
const app=initializeApp(FB);
const db=getDatabase(app);
const dbRef=ref(db,"finanzasFamilia");

// ── CONFIG POR DEFECTO (editable en pestaña Config) ──
const DEFCFG={
  nombres:["Ivan","Noelia"],
  pin:"130221",
  meta:1000000,
  pctAhorro:10,
  mesesFE:3,
  fmtAbrev:false,
  catGas:["Cochera","Combustible","Compras","Deporte","Educación","Farmacia","Impuestos","Otros","Regalos","Salidas","Salud","Supermercado","Transporte"],
  catGasDef:"Supermercado",
  ingCats:[
    {label:"Sanatorio de la Mujer",persona:"Noelia",medio:"banco"},
    {label:"Sanatorio Aliare",persona:"Noelia",medio:"banco"},
    {label:"Domicilio",persona:"Noelia",medio:"efectivo"},
    {label:"Office Amoblamientos",persona:"Ivan",medio:"banco"},
    {label:"Extra Office",persona:"Ivan",medio:"banco"},
    {label:"Comisiones Office",persona:"Ivan",medio:"banco"},
    {label:"Asignación x Hijo",persona:"Ivan",medio:"banco"},
    {label:"Otro",persona:"Ivan",medio:"banco"}
  ]
};
let CFG=JSON.parse(JSON.stringify(DEFCFG));

const MC=["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
const MESES=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const COLORS=["#4F46E5","#10B981","#F59E0B","#EF4444","#8B5CF6","#3B82F6","#D97706","#059669","#DC2626"];

let D={ingresos:[],gastos:[],tarjetas:[],ahorros:{},declarados:[],recurrentes:[],presupuestoCat:{},config:{}};
let mes=new Date().getMonth(),anio=new Date().getFullYear(),tabAct="resumen",saving=false;
// Exponer para handlers inline (script es module)
window.CFG=CFG;
Object.defineProperty(window,"D",{get:()=>D,set:v=>{D=v;}});
const key=(m,a)=>`${a}-${m}`;
const fmt=n=>new Intl.NumberFormat("es-AR",{style:"currency",currency:"ARS",minimumFractionDigits:0,maximumFractionDigits:0}).format(n||0);
const fmtK=n=>{const a=Math.abs(n||0);return(n<0?"-":"")+"$"+(a>=1000000?(a/1000000).toFixed(1)+"M":a>=1000?Math.round(a/1000)+"k":String(Math.round(a)))};
const fmtBig=n=>CFG.fmtAbrev?fmtK(n):fmt(n);

// ── FIREBASE ──
function syncBar(type,msg){
  const b=document.getElementById("syncBar");
  b.className=type+" show";b.textContent=msg;
  if(type==="ok")setTimeout(()=>b.classList.remove("show"),2000);
}
function save(){
  if(saving)return;
  saving=true;
  D.config=CFG;
  syncBar("saving","Guardando...");
  set(dbRef,D).then(()=>{syncBar("ok","✓ Sincronizado");saving=false;})
    .catch(()=>{syncBar("error","⚠️ Error al guardar");saving=false;});
}
window.save=save;

onValue(dbRef,snap=>{
  if(saving)return;
  const d=snap.val();
  if(d&&(d.ingresos||d.gastos||d.tarjetas)){
    D=d;
    if(!D.ingresos)D.ingresos=[];
    if(!D.gastos)D.gastos=[];
    if(!D.tarjetas)D.tarjetas=[];
    if(!D.ahorros)D.ahorros={};
    if(!D.declarados)D.declarados=[];
    if(!D.recurrentes)D.recurrentes=[];
    if(!D.presupuestoCat)D.presupuestoCat={};
    // Config: merge guardado con defaults
    CFG=Object.assign({},DEFCFG,D.config||{});
    window.CFG=CFG;
    if(!CFG.catGas||!CFG.catGas.length)CFG.catGas=DEFCFG.catGas.slice();
    if(!CFG.ingCats||!CFG.ingCats.length)CFG.ingCats=JSON.parse(JSON.stringify(DEFCFG.ingCats));
    // MIGRACIÓN: secundario → fondo
    Object.values(D.ahorros).forEach(a=>{
      if(a&&a.fondo===undefined&&a.secundario!==undefined)a.fondo=a.secundario;
      if(a&&(a.medioF===undefined)&&a.medioS!==undefined)a.medioF=a.medioS;
    });
    // MIGRACIÓN: tarjetas sin medio/debitada

        D.gastos.push({id:Date.now()+Math.floor(Math.random()*999),desc:r.desc,cat:r.cat,monto:r.monto,
          mes:rm,anio:ra,medio:r.medio||"banco",recId:r.id,fecha:new Date().toLocaleDateString("es-AR")});
        recNew=true;

  } else {

  renderAll();
});

// ── CÁLCULO CENTRAL ──
function calcSaldos(){
  const ingM=D.ingresos.filter(i=>i.mes===mes&&i.anio===anio);
  const gasM=D.gastos.filter(g=>g.mes===mes&&g.anio===anio);
  const tcM =D.tarjetas.filter(t=>t.mes===mes&&t.anio===anio);
  const k=key(mes,anio);
  const sav=D.ahorros[k]||{principal:0,fondo:0,medioP:"banco",medioF:"efectivo"};

  const F=(arr,fn)=>arr.filter(fn).reduce((s,x)=>s+(x.monto||x.total||0),0);
  // Ingresos
  const ingBancoTot =F(ingM,i=>(i.medio||"banco")==="banco");
  const ingEfecTot  =F(ingM,i=>i.medio==="efectivo");
  const ingBancoConf=F(ingM,i=>i.confirmado&&(i.medio||"banco")==="banco");
  const ingEfecConf =F(ingM,i=>i.confirmado&&i.medio==="efectivo");
  const totIng=ingBancoTot+ingEfecTot;
  const totIngConf=ingBancoConf+ingEfecConf;
  // Egresos
  const gasBanco=gasM.filter(g=>(g.medio||"banco")==="banco");
  const gasEfec =gasM.filter(g=>g.medio==="efectivo");
  const gasBancoReg=F(gasBanco,_=>true), gasBancoPag=F(gasBanco,g=>g.pagado);
  const gasEfecReg =F(gasEfec,_=>true),  gasEfecPag =F(gasEfec,g=>g.pagado);
  const totGas=gasBancoReg+gasEfecReg, totGasPag=gasBancoPag+gasEfecPag;
  // TC (solo debitadas descuentan)
  const tcBancoDeb=F(tcM,t=>t.debitada&&(t.medio||"banco")==="banco");
  const tcEfecDeb =F(tcM,t=>t.debitada&&t.medio==="efectivo");
  const tcBancoTot=F(tcM,t=>(t.medio||"banco")==="banco");
  const tcEfecTot =F(tcM,t=>t.medio==="efectivo");
  const totTC=tcBancoTot+tcEfecTot, totTCDeb=tcBancoDeb+tcEfecDeb;
  // Ahorro del mes por medio
  const savP=sav.principal||0, savF=sav.fondo||0;
  const ahoBancoMes=((sav.medioP||"banco")==="banco"?savP:0)+((sav.medioF||"efectivo")==="banco"?savF:0);
  const ahoEfecMes =((sav.medioP||"banco")==="efectivo"?savP:0)+((sav.medioF||"efectivo")==="efectivo"?savF:0);
  const totSavMes=savP+savF;
  // DISPONIBLES
  const dispBanco=ingBancoConf-gasBancoPag-tcBancoDeb-ahoBancoMes;
  const dispEfec =ingEfecConf -gasEfecPag -tcEfecDeb -ahoEfecMes;
  // PATRIMONIO
  let ahoPrincipalAcum=0,fondoAcum=0;
  Object.values(D.ahorros).forEach(a=>{ahoPrincipalAcum+=(a.principal||0);fondoAcum+=(a.fondo||0);});
  const declaradosTot=(D.declarados||[]).reduce((s,d)=>s+(d.monto||0),0);
  const patrimonio=ahoPrincipalAcum+fondoAcum+declaradosTot;
  // Cats
  const catMap={};
  gasM.forEach(g=>{catMap[g.cat]=(catMap[g.cat]||0)+g.monto;});
  const cats=Object.entries(catMap).sort((a,b)=>b[1]-a[1]);

  return{ingM,gasM,tcM,gasBanco,gasEfec,sav,
    totIng,totIngConf,ingBancoTot,ingEfecTot,ingBancoConf,ingEfecConf,
    totGas,totGasPag,gasBancoReg,gasBancoPag,gasEfecReg,gasEfecPag,
    totTC,totTCDeb,tcBancoTot,tcEfecTot,
    savP,savF,totSavMes,ahoBancoMes,ahoEfecMes,
    ahoPrincipalAcum,fondoAcum,declaradosTot,patrimonio,
    dispBanco,dispEfec,cats,
    pctMeta:CFG.meta>0?Math.min(totSavMes/CFG.meta*100,100):0};
}
function calcMini(m,a){
  const ing=D.ingresos.filter(i=>i.mes===m&&i.anio===a).reduce((s,i)=>s+i.monto,0);
  const gas=D.gastos.filter(g=>g.mes===m&&g.anio===a).reduce((s,g)=>s+g.monto,0);
  const tc=D.tarjetas.filter(t=>t.mes===m&&t.anio===a).reduce((s,t)=>s+(t.total||0),0);
  return{ing,egr:gas+tc};
}

  cb.textContent=fmtK(s.dispBanco);cb.style.color=s.dispBanco>=0?"var(--green)":"var(--red)";

window.addGas=function(medio,pfx){
  const desc=document.getElementById(pfx+"-desc").value.trim();
  const cat=document.getElementById(pfx+"-cat").value;
  const monto=parseFloat(document.getElementById(pfx+"-monto").value);
  if(!desc||isNaN(monto)||monto<=0)return;
  const venc=document.getElementById(pfx+"-venc")?.value||null;
  const gid=Date.now();
  const g={id:gid,desc,cat,monto,mes,anio,medio,venc,fecha:new Date().toLocaleDateString("es-AR")};
  if(window["_"+pfx+"Rec"]){
    const rid="rec"+gid;
    D.recurrentes.push({id:rid,desc,cat,monto,medio});
    g.recId=rid;
  }
  D.gastos.push(g);
  document.getElementById(pfx+"-desc").value="";
  document.getElementById(pfx+"-monto").value="";
  save();renderAll();
}

  D.ahorros[k][campo]=Number(val)||0;
  save();updateChips();
}

  const k=key(mes,anio);
  if(!D.ahorros[k])D.ahorros[k]={principal:0,fondo:0,medioP:"banco",medioF:"efectivo"};
  D.ahorros[k][campo]=m;
  save();rAhorro();updateChips();
}

          <button class="idel" onclick="delRec(${i})">✕</button>
        </div>
      </div>`).join("")||`<p style="text-align:center;color:var(--muted);font-size:11px;padding:8px 0">Sin recurrentes. Marcá "🔁 Cada mes" al cargar un egreso.</p>`}
    </div>
    <div class="card">
      <div class="card-title">🎨 Apariencia</div>
      <div class="dr"><span class="lbl">Modo oscuro</span>
        <button class="medio-btn" style="width:auto;padding:6px 14px" onclick="toggleDark()">🌙/☀️ Cambiar</button></div>
      <div class="dr"><span class="lbl">Montos grandes abreviados ($1.2M)</span>
        <button class="medio-btn${CFG.fmtAbrev?" act-ind":""}" style="width:auto;padding:6px 14px" onclick="CFG.fmtAbrev=!CFG.fmtAbrev;save();renderAll()">${CFG.fmtAbrev?"Sí":"No"}</button></div>
    </div>
    <div class="card">
      <div class="card-title">💾 Datos</div>
      <div class="frow fg">
        <button class="btn btn-ind" onclick="exportJSON()">📥 Exportar</button>
        <button class="btn btn-ghost" onclick="document.getElementById('imp-file').click()">📤 Importar</button>
      </div>
      <input type="file" id="imp-file" accept=".json" style="display:none" onchange="importJSON(event)">
      <div style="margin-top:8px">
        <div class="card-title">Backups (${backups.length}/10)</div>
        ${backups.slice(0,5).map((b,i)=>`<div class="dr">
          <span class="lbl" style="font-size:10px">${b.fecha}</span>
          <div style="display:flex;gap:5px">
            <button style="font-size:9px;padding:3px 8px;border-radius:6px;border:1px solid var(--border);cursor:pointer;background:var(--light);color:var(--text)" onclick="restoreBackup(${i})">Restaurar</button>
            <button class="idel" style="width:auto;padding:3px 6px;font-size:9px" onclick="delBackup(${i})">✕</button>
          </div>
        </div>`).join("")||`<p style="color:var(--muted);font-size:10px;text-align:center;padding:6px 0">Sin backups</p>`}
        <button class="btn btn-ghost" style="margin-top:6px" onclick="crearBackup()">💾 Backup ahora</button>
      </div>
    </div>
    <div class="card" style="border-color:var(--red)">
      <div class="card-title" style="color:var(--red)">⚠️ Zona peligrosa</div>
      <button class="btn btn-ghost" style="border-color:var(--red);color:var(--red);margin-bottom:8px" onclick="borrarMes()">🗑️ Borrar todo ${MESES[mes]} ${anio}</button>
      <button class="btn btn-red" onclick="borrarTodo()">💣 Borrar TODOS los datos</button>
    </div>
    <div style="margin-bottom:24px"></div>`;
}
window.cambiarPin=function(){
  const old=document.getElementById("cfg-pin-old").value;
  const nw=document.getElementById("cfg-pin-new").value;
  if(old!==CFG.pin){syncBar("error","PIN actual incorrecto");return;}
  if(!/^\d{6}$/.test(nw)){syncBar("error","El PIN nuevo debe tener 6 dígitos");return;}
  CFG.pin=nw;save();syncBar("ok","✓ PIN actualizado");
  document.getElementById("cfg-pin-old").value="";
  document.getElementById("cfg-pin-new").value="";
}
window.addCatGas=function(){
  const c=document.getElementById("cfg-newcat").value.trim();
  if(!c||CFG.catGas.includes(c))return;
  CFG.catGas.push(c);CFG.catGas.sort((a,b)=>a.localeCompare(b,"es"));
  save();rConfig();
}
window.delCatGas=function(i){
  const c=CFG.catGas[i];
  if(D.gastos.some(g=>g.cat===c)){
    if(!confirm(`Hay gastos con la categoría "${c}". ¿Eliminarla igual? (los gastos la conservan)`))return;
  }
  CFG.catGas.splice(i,1);
  if(CFG.catGasDef===c)CFG.catGasDef=CFG.catGas[0]||"";
  save();rConfig();
}
window.addIngCat=function(){
  const label=document.getElementById("cfg-ing-label").value.trim();
  const persona=document.getElementById("cfg-ing-persona").value;
  const medio=document.getElementById("cfg-ing-medio").value;
  if(!label||CFG.ingCats.some(c=>c.label===label))return;
  CFG.ingCats.push({label,persona,medio});
  save();rConfig();
}
window.delIngCat=function(i){
  CFG.ingCats.splice(i,1);
  save();rConfig();
}
window.delRec=function(i){
  D.recurrentes.splice(i,1);
  save();rConfig();
}
window.borrarMes=function(){
  if(!confirm(`¿Borrar TODOS los movimientos de ${MESES[mes]} ${anio}? No se puede deshacer.`))return;
  D.ingresos=D.ingresos.filter(i=>!(i.mes===mes&&i.anio===anio));
  D.gastos=D.gastos.filter(g=>!(g.mes===mes&&g.anio===anio));
  D.tarjetas=D.tarjetas.filter(t=>!(t.mes===mes&&t.anio===anio));
  delete D.ahorros[key(mes,anio)];
  save();renderAll();syncBar("ok","✓ Mes borrado");
}
window.borrarTodo=function(){
  if(!confirm("⚠️ ¿Borrar ABSOLUTAMENTE TODOS los datos?"))return;
  if(!confirm("Última confirmación: se pierde todo el historial. ¿Seguro?"))return;
  D={ingresos:[],gastos:[],tarjetas:[],ahorros:{},declarados:[],recurrentes:[],presupuestoCat:{},config:CFG};
  save();renderAll();syncBar("ok","Datos borrados");
}
window.exportJSON=function(){
  const blob=new Blob([JSON.stringify(D,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download=`finanzas-${new Date().toLocaleDateString("es-AR").replace(/\//g,"-")}.json`;a.click();
}
window.importJSON=function(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{try{D=JSON.parse(ev.target.result);save();renderAll();}catch(x){alert("Error al importar");}};
  r.readAsText(f);
}
window.crearBackup=function(){
  let bs=JSON.parse(localStorage.getItem("fi-backups")||"[]");
  bs.unshift({fecha:new Date().toLocaleString("es-AR"),data:JSON.stringify(D)});
  if(bs.length>10)bs=bs.slice(0,10);
  localStorage.setItem("fi-backups",JSON.stringify(bs));
  syncBar("ok","✓ Backup creado");rConfig();
}
window.restoreBackup=function(i){
  const bs=JSON.parse(localStorage.getItem("fi-backups")||"[]");
  if(bs[i]&&confirm("¿Restaurar este backup? Pisa los datos actuales.")){D=JSON.parse(bs[i].data);save();renderAll();}
}
window.delBackup=function(i){
  const bs=JSON.parse(localStorage.getItem("fi-backups")||"[]");
  bs.splice(i,1);localStorage.setItem("fi-backups",JSON.stringify(bs));rConfig();
}
window.setPresCat=function(k,cat,val){
  if(!D.presupuestoCat[k])D.presupuestoCat[k]={};
  const n=parseFloat(val);
  if(!isNaN(n)&&n>0)D.presupuestoCat[k][cat]=n;else delete D.presupuestoCat[k][cat];
  save();
}

// ── ACCIONES ──
window.toggleConf=function(id){
  const i=D.ingresos.find(x=>x.id===id);if(!i)return;
  i.confirmado=!i.confirmado;
  save();renderAll();
}
window.togglePago=function(id){
  const g=D.gastos.find(x=>x.id===id);if(!g)return;
  g.pagado=!g.pagado;
  if(g.pagado)g.fechaPago=new Date().toLocaleDateString("es-AR");else delete g.fechaPago;
  save();renderAll();
}
window.delIng=function(id){
  D.ingresos=D.ingresos.filter(i=>String(i.id)!==String(id));
  save();renderAll();
}
window.delGas=function(id){
  D.gastos=D.gastos.filter(g=>String(g.id)!==String(id));
  save();renderAll();
}

// ── MODAL ──
let _mT=null,_mId=null,_mMedio="banco",_mPer=0;
window.openModal=function(tipo,id){
  let obj=null;
  if(tipo==="ing")obj=D.ingresos.find(i=>String(i.id)===String(id));
  else if(tipo==="gas")obj=D.gastos.find(g=>String(g.id)===String(id));
  else if(tipo==="tc")obj=D.tarjetas.find(t=>String(t.id)===String(id));
  else obj=D.declarados.find(d=>String(d.id)===String(id));
  if(!obj)return;
  _mT=tipo;_mId=id;_mMedio=obj.medio||"banco";
  _mPer=CFG.nombres.indexOf(obj.persona)>=0?CFG.nombres.indexOf(obj.persona):0;
  document.getElementById("m-title").textContent="✏️ Editar "+(tipo==="ing"?"Ingreso":tipo==="gas"?"Egreso":tipo==="tc"?"Tarjeta":"Ahorro declarado");
  document.getElementById("m-desc").value=obj.desc||obj.nombre||"";
  document.getElementById("m-monto").value=obj.monto||obj.total||"";
  document.getElementById("m-cat-row").style.display=tipo==="gas"?"block":"none";
  if(tipo==="gas")document.getElementById("m-cat").innerHTML=CFG.catGas.map(c=>`<option${c===obj.cat?" selected":""}>${c}</option>`).join("");
  document.getElementById("m-persona-row").style.display=(tipo==="ing"||tipo==="tc")?"block":"none";
  document.getElementById("m-p1").textContent="👤 "+CFG.nombres[0];
  document.getElementById("m-p2").textContent="👤 "+CFG.nombres[1];
  document.getElementById("m-medio-row").style.display=tipo==="dec"?"none":"block";
  mMedio(_mMedio);mPersona(_mPer);
  document.getElementById("modal").classList.remove("hide");
}
window.closeModal=function(){document.getElementById("modal").classList.add("hide");_mT=null;}
window.saveModal=function(){
  if(!_mT||_mId===null)return;
  const desc=document.getElementById("m-desc").value.trim();
  const monto=parseFloat(document.getElementById("m-monto").value);
  if(!desc||isNaN(monto)||monto<=0){closeModal();return;}
  if(_mT==="ing"){const o=D.ingresos.find(x=>String(x.id)===String(_mId));if(o){o.desc=desc;o.monto=monto;o.persona=CFG.nombres[_mPer];o.medio=_mMedio;}}
  else if(_mT==="gas"){const o=D.gastos.find(x=>String(x.id)===String(_mId));if(o){o.desc=desc;o.monto=monto;o.cat=document.getElementById("m-cat").value;o.medio=_mMedio;}}
  else if(_mT==="tc"){const o=D.tarjetas.find(x=>String(x.id)===String(_mId));if(o){o.desc=desc;o.total=monto;o.persona=CFG.nombres[_mPer];o.medio=_mMedio;}}
  else{const o=D.declarados.find(x=>String(x.id)===String(_mId));if(o){o.nombre=desc;o.monto=monto;}}
  save();closeModal();renderAll();
}
window.mMedio=function(m){
  _mMedio=m;
  document.getElementById("m-banco").className="medio-btn"+(m==="banco"?" act-blue":"");
  document.getElementById("m-efec").className="medio-btn"+(m==="efectivo"?" act-amb":"");
}
window.mPersona=function(p){
  _mPer=p;
  document.getElementById("m-p1").className="medio-btn"+(p===0?" act-ind":"");
  document.getElementById("m-p2").className="medio-btn"+(p===1?" act-ind":"");
}
document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal();});

// ── PIN ──
let pinIn="";
window.pk=function(d){pinIn+=d;updDots();if(pinIn.length===6)pksubmit();}
window.pkdel=function(){pinIn=pinIn.slice(0,-1);updDots();}
window.pksubmit=function(){
  if(pinIn===CFG.pin){document.getElementById("pin").classList.add("hide");}
  else{document.getElementById("pinErr").textContent="PIN incorrecto";pinIn="";updDots();
    setTimeout(()=>{document.getElementById("pinErr").textContent="";},1500);}
}
function updDots(){for(let i=0;i<6;i++)document.getElementById("pd"+i).classList.toggle("on",i<pinIn.length);}

// ── DARK ──
window.toggleDark=function(){
  const d=document.body.classList.toggle("dark");
  document.getElementById("darkBtn").textContent=d?"☀️":"🌙";
  localStorage.setItem("fi-dark",d?"1":"0");
}
if(localStorage.getItem("fi-dark")==="1"){document.body.classList.add("dark");document.getElementById("darkBtn").textContent="☀️";}

// ── TABS + SWIPE ──
const TAB_ORDER=["resumen","ingresos","egr-banco","egr-efec","tc","ahorro","config"];
function goTab(t){
  document.querySelectorAll(".tb").forEach(b=>b.classList.toggle("on",b.dataset.tab===t));
  tabAct=t;
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("on"));
  document.getElementById("page-"+t).classList.add("on");
  document.querySelector(`.tb[data-tab="${t}"]`)?.scrollIntoView({behavior:"smooth",block:"nearest",inline:"center"});
  renderAll();
}
function renderAll(){
  updateChips();
  if(tabAct==="resumen")rResumen();
  else if(tabAct==="ingresos")rIngresos();
  else if(tabAct==="egr-banco")rEgrBanco();
  else if(tabAct==="egr-efec")rEgrEfec();
  else if(tabAct==="tc")rTC();
  else if(tabAct==="ahorro")rAhorro();
  else if(tabAct==="config")rConfig();
}
window.renderAll=renderAll;
document.querySelectorAll(".tb").forEach(b=>b.addEventListener("click",()=>goTab(b.dataset.tab)));
let swX=null,swY=null;
const cnt=document.getElementById("mainCnt");
cnt.addEventListener("touchstart",e=>{swX=e.touches[0].clientX;swY=e.touches[0].clientY;},{passive:true});
cnt.addEventListener("touchend",e=>{
  if(swX===null)return;
  const dx=e.changedTouches[0].clientX-swX,dy=e.changedTouches[0].clientY-swY;
  swX=null;swY=null;
  if(Math.abs(dy)>Math.abs(dx)||Math.abs(dx)<55)return;
  const c=TAB_ORDER.indexOf(tabAct);
  if(dx<-55&&c<TAB_ORDER.length-1)goTab(TAB_ORDER[c+1]);
  if(dx>55&&c>0)goTab(TAB_ORDER[c-1]);
},{passive:true});

document.getElementById("selMes").addEventListener("change",e=>{mes=Number(e.target.value);renderAll();});
document.getElementById("selAnio").addEventListener("change",e=>{anio=Number(e.target.value);renderAll();});
document.getElementById("selMes").value=mes;
document.getElementById("selAnio").value=anio;

// Backup automático diario
const hoy=new Date().toDateString();
if(localStorage.getItem("fi-bk-date")!==hoy){
  setTimeout(()=>{if(D.ingresos&&D.ingresos.length>0){crearBackup();localStorage.setItem("fi-bk-date",hoy);}},8000);
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Finanzas · Ivan & Noelia</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#faf9f6;--surface:#ffffff;--surface2:#f3f1ec;
  --border:#e5e2db;--border2:#d4d0c8;
  --text:#1c1a17;--muted:#8a8680;--light:#ede9e2;
  --green:#1a5c3a;--green2:#2d7a52;--green-lt:#eaf4ee;--green-md:#c5e8d1;
  --red:#b83232;--red-lt:#fdf0f0;
  --blue:#1a3d7a;--blue-lt:#eef2fb;
  --amber:#a06000;--amber-lt:#fef7ed;
  --gold:#c8972a;--gold-lt:#fdf4e0;
  --ivan:#1a3d7a;--noelia:#6b2d8b;
  --r:12px;--r2:18px;
  --sh:0 1px 4px rgba(0,0,0,.07),0 1px 2px rgba(0,0,0,.04);
  --sh2:0 4px 16px rgba(0,0,0,.08),0 1px 4px rgba(0,0,0,.04);
}
body.dark{
  --bg:#0f1117;--surface:#1a1d27;--surface2:#222636;
  --border:#2a2d3e;--border2:#363950;
  --text:#e8e6f0;--muted:#6b6e82;--light:#1f2235;
  --green:#3dba6e;--green2:#2d9a52;--green-lt:#0d2218;--green-md:#1a4a2e;
  --red:#e05555;--red-lt:#2a0f0f;
  --blue:#5b8dee;--blue-lt:#0d1a35;
  --amber:#e09820;--amber-lt:#2a1e05;
  --gold:#e0b030;--gold-lt:#2a2005;
  --ivan:#5b8dee;--noelia:#c07ae0;
  --sh:0 1px 4px rgba(0,0,0,.3),0 1px 2px rgba(0,0,0,.2);
  --sh2:0 4px 16px rgba(0,0,0,.4),0 1px 4px rgba(0,0,0,.3);
}

/* ── RESPONSIVE MOBILE-FIRST ── */

/* Base mobile fixes */
*{-webkit-tap-highlight-color:transparent;}
html,body{width:100%;overflow-x:hidden;}

/* Content max width */
.cnt{padding:12px;max-width:100%;margin:0 auto;}

/* Header compact on mobile */
.hdr{padding:36px 14px 0;}
.hdr-top{padding-bottom:10px;gap:8px;}
.hdr-title{font-size:18px;}
.mes-row{gap:6px;padding-bottom:0;}
.sel{padding:6px 8px;font-size:11px;}

/* Tabs compact */
.tb{padding:11px 12px;font-size:10px;letter-spacing:.3px;}

/* Stats: 2 cols on mobile */
.g2{grid-template-columns:1fr 1fr;gap:8px;}
.stat{padding:11px 12px;}
.stat-val{font-size:14px;}
.stat-lbl{font-size:9px;}

/* Items: fix overflow */
.item{padding:9px 10px;gap:6px;}
.item-l{min-width:0;flex:1;}
.item-desc{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:calc(100vw - 180px);}
.item-sub{font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.item-r{flex-shrink:0;gap:4px;}

/* Cards */
.card{padding:13px;border-radius:14px;}

/* Mini header chips - smaller on very small phones */
@media (max-width:380px){
  #miniResumen{display:none!important;}
  .hdr-title{font-size:16px;}
}

/* Tablet 600px+ */
@media (min-width:600px){
  .cnt{padding:16px 20px;max-width:600px;}
  .hdr{padding:40px 20px 0;}
  .tb{font-size:11px;padding:12px 16px;}
  .item-desc{max-width:none;white-space:normal;}
  .item-sub{white-space:normal;}
  .stat-val{font-size:16px;}
  .g2{grid-template-columns:repeat(4,1fr);}
}

/* Desktop 900px+ */
@media (min-width:900px){
  .cnt{max-width:680px;padding:20px 0;}
  .hdr{padding:44px 32px 0;}
  .tabs{padding:0 32px!important;margin:0 -32px!important;}
  .tb{font-size:12px;padding:13px 18px;}
  .card{padding:18px;border-radius:18px;}
  .item{padding:12px 14px;}
  .item-desc{font-size:13px;}
  #editModal .modal-sheet{border-radius:20px;margin-bottom:40px;max-width:480px;}
}

/* Delete button always visible and touchable */
.idel{min-width:28px;min-height:28px;display:flex;align-items:center;justify-content:center;border-radius:8px;background:var(--red-lt);color:var(--red);font-size:13px;border:none;cursor:pointer;padding:4px;}
.idel:active{background:var(--red);color:#fff;}

/* Edit button */
.ebtn{min-width:28px;min-height:28px;display:flex;align-items:center;justify-content:center;border-radius:8px;background:var(--light);color:var(--muted);font-size:12px;border:none;cursor:pointer;padding:4px;}
.ebtn:active{background:var(--border2);}

#lockScreen{position:fixed;inset:0;z-index:9999;background:#0f1117;display:flex;align-items:center;justify-content:center;flex-direction:column;}
#lockScreen.hidden{display:none;}
.lock-logo{font-family:'Inter',sans-serif;font-size:28px;color:#3dba6e;margin-bottom:6px;}
.lock-sub{font-size:12px;color:#6b6e82;margin-bottom:32px;}
.pin-dots{display:flex;gap:14px;margin-bottom:28px;}
.pin-dot{width:14px;height:14px;border-radius:50%;border:2px solid #3dba6e;background:transparent;transition:background .15s;}
.pin-dot.filled{background:#3dba6e;}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:240px;}
.pin-btn{background:#1a1d27;border:1px solid #2a2d3e;border-radius:14px;color:#e8e6f0;font-size:22px;font-weight:300;padding:16px;cursor:pointer;font-family:'Inter',sans-serif;transition:background .15s;}
.pin-btn:active{background:#2a2d3e;}
.pin-err{font-size:12px;color:#e05555;height:18px;text-align:center;margin-bottom:8px;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s;}

/* ── SYNC ── */
#syncBar{position:fixed;top:0;left:0;right:0;z-index:999;padding:7px 16px;font-size:11px;font-weight:500;text-align:center;transition:opacity .4s;letter-spacing:.2px;}
#syncBar.ok{background:var(--green-lt);color:var(--green);}
#syncBar.saving{background:var(--amber-lt);color:var(--amber);}
#syncBar.error{background:var(--red-lt);color:var(--red);}
#syncBar.hide{opacity:0;pointer-events:none;}

/* ── HEADER ── */
.hdr{background:var(--surface);border-bottom:1px solid var(--border);padding:38px 20px 0;position:sticky;top:0;z-index:100;box-shadow:var(--sh);}
.hdr-top{display:flex;align-items:flex-start;justify-content:space-between;padding-bottom:12px;}
.hdr-title{font-family:'Inter',sans-serif;font-size:22px;font-weight:500;letter-spacing:-.5px;color:var(--text);}
.hdr-sub{font-size:11px;color:var(--muted);margin-top:2px;}
.mes-row{display:flex;gap:8px;padding-bottom:0;}
.sel{border:1px solid var(--border);background:var(--surface2);border-radius:8px;padding:7px 11px;font-family:'Inter',sans-serif;font-size:12px;color:var(--text);font-weight:500;outline:none;cursor:pointer;}

/* ── TABS ── */
.tabs{display:flex;background:var(--surface);border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
.tabs::-webkit-scrollbar{display:none;}
.tb{flex-shrink:0;padding:13px 15px;background:none;border:none;border-bottom:2px solid transparent;font-family:'Inter',sans-serif;font-size:11px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap;text-transform:uppercase;letter-spacing:.5px;transition:color .2s;}
.tb.on{color:var(--green);border-bottom-color:var(--green);}

/* ── CONTENT ── */
.cnt{padding:16px;max-width:500px;margin:0 auto;}
.page{display:none;}.page.on{display:block;}

/* ── CARDS ── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);padding:16px;margin-bottom:12px;box-shadow:var(--sh);}
.card-title{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:14px;}
.card.accent-green{border-left:3px solid var(--green);}
.card.accent-gold{border-left:3px solid var(--gold);}

/* ── STAT GRID ── */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px;}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);padding:14px;box-shadow:var(--sh);}
.stat-ico{font-size:17px;margin-bottom:5px;}
.stat-lbl{font-size:10px;color:var(--muted);font-weight:500;margin-bottom:3px;}
.stat-val{font-size:16px;font-weight:600;font-family:'JetBrains Mono',monospace;letter-spacing:-.3px;}

/* ── PROGRESS ── */
.prog-hdr{display:flex;justify-content:space-between;font-size:11px;margin-bottom:7px;}
.prog-track{background:var(--light);border-radius:6px;height:9px;overflow:hidden;}
.prog-bar{height:100%;border-radius:6px;transition:width .7s cubic-bezier(.4,0,.2,1);}
.prog-ftr{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-top:5px;}

/* ── PERSONA ── */
.p2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
.pcrd{background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);padding:13px;box-shadow:var(--sh);}
.pcrd.iv{border-left:3px solid var(--ivan);}
.pcrd.no{border-left:3px solid var(--noelia);}
.pname{font-size:10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;}
.ptot{font-size:16px;font-weight:600;font-family:'JetBrains Mono',monospace;}
.ppct{font-size:10px;color:var(--muted);margin-top:2px;}

/* ── AHORRO HERO ── */
.ahorro-hero{text-align:center;padding:22px 0 14px;}
.ahorro-num{font-family:'Inter',sans-serif;font-size:42px;font-weight:500;letter-spacing:-1px;}
.ahorro-sub{font-size:12px;color:var(--muted);margin-top:4px;}

/* ── SAVINGS BOXES ── */
.sav-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
.sav-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);padding:14px;box-shadow:var(--sh);}
.sav-box.main{border-top:3px solid var(--gold);}
.sav-box.sec{border-top:3px solid var(--green2);}
.sav-lbl{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:8px;}
.sav-input{width:100%;border:1px solid var(--border);border-radius:8px;padding:9px 10px;font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:500;color:var(--text);background:var(--bg);outline:none;text-align:center;}
.sav-input:focus{border-color:var(--green);background:var(--surface);}

/* ── ITEMS ── */
.item{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:10px;border:1px solid var(--border);margin-bottom:7px;background:var(--surface);}
.item-l{flex:1;min-width:0;}
.item-desc{font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.item-sub{font-size:10px;color:var(--muted);margin-top:1px;}
.item-r{display:flex;align-items:center;gap:6px;margin-left:6px;flex-shrink:0;}
.iamt{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:500;cursor:pointer;border-bottom:1px dashed currentColor;padding-bottom:1px;}

/* ── EDIT MODAL ── */
#editModal{position:fixed;inset:0;z-index:9000;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);}
#editModal.hidden{display:none;}
#editModal .modal-sheet{background:var(--surface);border-radius:20px 20px 0 0;padding:20px;width:100%;max-width:500px;max-height:85vh;overflow-y:auto;box-shadow:0 -4px 32px rgba(0,0,0,.2);}
#editModal .modal-handle{width:40px;height:4px;background:var(--border2);border-radius:2px;margin:0 auto 16px;}
#editModal .modal-title{font-size:15px;font-weight:600;margin-bottom:16px;color:var(--text);}
#editModal .modal-field{margin-bottom:12px;}
#editModal .modal-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:5px;display:block;}
#editModal .modal-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
#editModal .medio-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.mbtn{padding:9px;border-radius:10px;font-family:'Inter',sans-serif;font-weight:600;font-size:12px;cursor:pointer;border:2px solid var(--border);background:var(--surface);color:var(--muted);transition:all .2s;}
.mbtn.active-banco{border-color:var(--blue);background:var(--blue-lt);color:var(--blue);}
.mbtn.active-efectivo{border-color:var(--amber);background:var(--amber-lt);color:var(--amber);}
.mbtn.active-ivan{border-color:var(--ivan);background:var(--blue-lt);color:var(--ivan);}
.mbtn.active-noelia{border-color:var(--noelia);background:#f5f0ff;color:var(--noelia);}
.modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px;}

.ew{display:flex;align-items:center;gap:5px;}

/* ── FORMS ── */
.finp,.fsel{width:100%;border:1px solid var(--border);border-radius:9px;padding:10px 12px;font-family:'Inter',sans-serif;font-size:13px;color:var(--text);background:var(--bg);outline:none;transition:border-color .2s;}
.finp:focus,.fsel:focus{border-color:var(--green);background:var(--surface);}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.fg{margin-bottom:9px;}
.btn{width:100%;padding:12px;border:none;border-radius:10px;font-family:'Inter',sans-serif;font-size:13px;font-weight:600;cursor:pointer;letter-spacing:.2px;transition:opacity .2s;}
.btn:active{opacity:.8;}
.btn.g{background:var(--green);color:#fff;}
.btn.r{background:var(--red);color:#fff;}
.btn.b{background:var(--blue);color:#fff;}
.btn.sm{padding:8px 14px;width:auto;font-size:12px;border-radius:8px;}

/* ── FILTROS ── */
.filtros{display:flex;gap:7px;margin-bottom:12px;flex-wrap:wrap;}
.fbtn{padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:var(--surface);font-family:'Inter',sans-serif;font-size:12px;font-weight:500;cursor:pointer;color:var(--muted);transition:all .2s;}
.fbtn.on{background:var(--green-lt);color:var(--green);border-color:var(--green);}

/* ── TOTALES ROW ── */
.tgrid{display:grid;gap:8px;margin-bottom:12px;}
.tcrd{background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);padding:12px 14px;box-shadow:var(--sh);}
.tlbl{font-size:10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px;}
.tval{font-size:17px;font-weight:600;font-family:'JetBrains Mono',monospace;}

/* ── DATA ROWS ── */
.dr{display:flex;justify-content:space-between;font-size:12px;margin-bottom:7px;}
.dr .lbl{color:var(--muted);}
.dr .val{font-family:'JetBrains Mono',monospace;font-weight:500;}
.dr.bold .lbl,.dr.bold .val{font-weight:600;font-size:13px;}
.dr.ind{padding-left:14px;opacity:.8;}
hr.div{border:none;border-top:1px solid var(--border);margin:8px 0;}

/* ── CAT SECTION ── */
.cst{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;padding:0 2px;}
.csn{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;}
.cstot{font-size:12px;font-family:'JetBrains Mono',monospace;font-weight:500;}
.cat-bar-track{background:var(--light);border-radius:4px;height:4px;}
.cat-bar-fill{height:100%;border-radius:4px;}

/* ── CHART ── */
.chart-wrap{overflow-x:auto;padding-bottom:8px;}
.chart-svg{display:block;}

/* ── HISTÓRICO TABLE ── */
.hist-table{width:100%;border-collapse:collapse;font-size:11px;}
.hist-table th{text-align:left;padding:7px 8px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px;border-bottom:2px solid var(--border);font-size:10px;}
.hist-table td{padding:8px 8px;border-bottom:1px solid var(--border);font-family:'JetBrains Mono',monospace;font-size:11px;}
.hist-table tr:last-child td{border-bottom:none;}
.hist-table .met{color:var(--green);font-weight:600;}
.hist-table .nom{color:var(--red);}
.badge{display:inline-block;padding:2px 7px;border-radius:20px;font-size:10px;font-weight:600;}
.badge.ok{background:var(--green-lt);color:var(--green);}
.badge.no{background:var(--red-lt);color:var(--red);}

/* ── TC DESGLOSE ── */
.tc-upload{border:2px dashed var(--border);border-radius:var(--r2);padding:24px;text-align:center;cursor:pointer;transition:all .2s;margin-bottom:12px;}
.tc-upload:hover{border-color:var(--green);background:var(--green-lt);}
.tc-upload input{display:none;}
.tc-upload-ico{font-size:28px;margin-bottom:8px;}
.tc-upload-txt{font-size:13px;color:var(--muted);font-weight:500;}
.tc-upload-sub{font-size:11px;color:var(--muted);margin-top:4px;}

/* ── ALERT ── */
.alert{border-radius:10px;padding:10px 14px;font-size:12px;margin-top:10px;}
.alert.w{background:var(--red-lt);color:var(--red);}
.alert.g{background:var(--green-lt);color:var(--green);}
.alert.a{background:var(--amber-lt);color:var(--amber);}

/* ── MISC ── */
.hint{font-size:10px;color:var(--muted);margin-bottom:10px;}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;flex-shrink:0;}
.sec-hdr{font-family:'Inter',sans-serif;font-size:16px;font-weight:500;color:var(--text);margin:18px 0 10px;letter-spacing:-.3px;}
.loading{display:flex;align-items:center;justify-content:center;height:50vh;flex-direction:column;gap:12px;color:var(--muted);}
.spin{width:26px;height:26px;border:3px solid var(--border);border-top-color:var(--green);border-radius:50%;animation:sp .8s linear infinite;}
@keyframes sp{to{transform:rotate(360deg);}}
.tag{font-size:10px;font-weight:600;background:var(--gold-lt);color:var(--gold);padding:2px 8px;border-radius:20px;display:inline-block;}
.tag.green{background:var(--green-lt);color:var(--green);}
.divider-line{height:1px;background:var(--border);margin:16px 0;}
</style>
</head>
<body>

<!-- EDIT MODAL -->
<div id="editModal" class="hidden">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title" id="editModalTitle">Editar</div>

    <div class="modal-field">
      <label class="modal-label">Descripción</label>
      <input class="finp" id="em-desc" placeholder="Descripción">
    </div>

    <div class="modal-field">
      <label class="modal-label">Monto</label>
      <input class="finp" id="em-monto" type="number" placeholder="$">
    </div>

    <div class="modal-field">
      <label class="modal-label">Categoría</label>
      <select class="fsel" id="em-cat" style="width:100%"></select>
    </div>

    <div class="modal-field" id="em-persona-wrap">
      <label class="modal-label">Persona</label>
      <div class="medio-btns">
        <button class="mbtn" id="em-ivan-btn" onclick="setEmPersona('Ivan')">👤 Ivan</button>
        <button class="mbtn" id="em-noelia-btn" onclick="setEmPersona('Noelia')">👤 Noelia</button>
      </div>
    </div>

    <div class="modal-field" id="em-medio-wrap">
      <label class="modal-label">Medio de pago</label>
      <div class="medio-btns">
        <button class="mbtn" id="em-banco-btn" onclick="setEmMedio('banco')">🏦 Banco</button>
        <button class="mbtn" id="em-efec-btn" onclick="setEmMedio('efectivo')">💵 Efectivo</button>
      </div>
    </div>

    <div class="modal-actions">
      <button class="btn" style="background:var(--light);color:var(--text)" onclick="cerrarModal()">Cancelar</button>
      <button class="btn g" onclick="guardarModal()">✓ Guardar</button>
    </div>
  </div>
</div>

<!-- LOCK SCREEN -->
<div id="lockScreen">
  <div class="lock-logo">Finanzas</div>
  <div class="lock-sub">Ivan & Noelia · ingresá tu PIN</div>
  <div class="pin-dots">
    <div class="pin-dot" id="pd0"></div><div class="pin-dot" id="pd1"></div>
    <div class="pin-dot" id="pd2"></div><div class="pin-dot" id="pd3"></div>
    <div class="pin-dot" id="pd4"></div><div class="pin-dot" id="pd5"></div>
  </div>
  <div class="pin-err" id="pinErr"></div>
  <div class="pin-pad">
    <button class="pin-btn" onclick="pinPress('1')">1</button>
    <button class="pin-btn" onclick="pinPress('2')">2</button>
    <button class="pin-btn" onclick="pinPress('3')">3</button>
    <button class="pin-btn" onclick="pinPress('4')">4</button>
    <button class="pin-btn" onclick="pinPress('5')">5</button>
    <button class="pin-btn" onclick="pinPress('6')">6</button>
    <button class="pin-btn" onclick="pinPress('7')">7</button>
    <button class="pin-btn" onclick="pinPress('8')">8</button>

// ── UTILS ────────────────────────────────────────────────────────────
const fmt=n=>new Intl.NumberFormat("es-AR",{style:"currency",currency:"ARS",minimumFractionDigits:0,maximumFractionDigits:0}).format(n||0);
const fmtK=n=>n>=1000000?(n/1000000).toFixed(1)+"M":(n>=1000?(n/1000).toFixed(0)+"k":String(n));
const key=(m,a)=>`${a}-${m}`;

function calcMes(m,a){
  const ingM=D.ingresos.filter(i=>i.mes===m&&i.anio===a);
  const gasM=D.gastos.filter(g=>g.mes===m&&g.anio===a);
  const tcM =D.tarjetas.filter(t=>t.mes===m&&t.anio===a);
  const ivan  =ingM.filter(i=>i.persona==="Ivan").reduce((s,i)=>s+i.monto,0);
  const noelia=ingM.filter(i=>i.persona==="Noelia").reduce((s,i)=>s+i.monto,0);
  const totIng=ivan+noelia;
  const totGas=gasM.reduce((s,g)=>s+g.monto,0);
  const totTC =tcM.reduce((s,t)=>s+(t.total||0),0);
  const totEgr=totGas+totTC;
  const sav=D.ahorros[key(m,a)]||{principal:0,secundario:0};
  const totSav=sav.principal+sav.secundario;
  const disponible=totIng-totEgr-totSav;
  const bal=totIng-totEgr;
  const metaOk=totSav>=META_AHORRO;

  const catMap={};
  gasM.forEach(g=>{catMap[g.cat]=(catMap[g.cat]||0)+g.monto;});
  tcM.forEach(t=>{catMap["Tarjeta de Crédito"]=(catMap["Tarjeta de Crédito"]||0)+(t.total||0);});
  const cats=Object.entries(catMap).sort((a,b)=>b[1]-a[1]);

  return{ingM,gasM,tcM,ivan,noelia,totIng,totGas,totTC,totEgr,bal,sav,totSav,disponible,metaOk,cats,pctPres:D.presupuesto>0?Math.min((totEgr/D.presupuesto)*100,100):0};
}

  setMedioIng(window._medioIng);
}

// ── RENDER EGRESOS ───────────────────────────────────────────────────
function rEgresos(){
  const c=calcMes(mes,anio);
  const catMap={};
  c.gasM.forEach(g=>{if(!catMap[g.cat])catMap[g.cat]=[];catMap[g.cat].push(g);});
  const cats=Object.entries(catMap).sort((a,b)=>b[1].reduce((s,x)=>s+x.monto,0)-a[1].reduce((s,x)=>s+x.monto,0));

  const totPagado  = c.gasM.filter(g=>g.pagado).reduce((s,g)=>s+g.monto,0);
  const totPendiente = c.gasM.filter(g=>!g.pagado).reduce((s,g)=>s+g.monto,0);
  const totBancoGas = c.gasM.filter(g=>(g.medio||'banco')==='banco').reduce((s,g)=>s+g.monto,0);
  const totEfecGas  = c.gasM.filter(g=>g.medio==='efectivo').reduce((s,g)=>s+g.monto,0);

  let html=`
    <p class="hint">✏️ Tocá el importe para editar · ⭕ Check para marcar pagado</p>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px">
      <div class="stat"><div class="stat-lbl">✅ Pagado</div><div class="stat-val" style="color:var(--green);font-size:13px">${fmt(totPagado)}</div></div>
      <div class="stat"><div class="stat-lbl">⏳ Pendiente</div><div class="stat-val" style="color:var(--amber);font-size:13px">${fmt(totPendiente)}</div></div>
      <div class="stat"><div class="stat-lbl">Total</div><div class="stat-val" style="color:var(--red);font-size:13px">${fmt(c.totGas)}</div></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px">
      <div class="stat" style="border-left:3px solid var(--blue)"><div class="stat-lbl">🏦 Banco</div><div class="stat-val" style="color:var(--blue);font-size:13px">${fmt(totBancoGas)}</div></div>
      <div class="stat" style="border-left:3px solid var(--amber)"><div class="stat-lbl">💵 Efectivo</div><div class="stat-val" style="color:var(--amber);font-size:13px">${fmt(totEfecGas)}</div></div>
    </div>
    <div class="card">
      <div class="card-title">+ Agregar egreso</div>
      <div class="fg"><input class="finp" id="g-desc" placeholder="Descripción"></div>
      <div class="fg"><select class="fsel" id="g-cat">${CAT_GAS.map(c=>`<option>${c}</option>`).join("")}</select></div>
      <div class="fg"><input class="finp" id="g-monto" type="number" placeholder="Monto $"></div>
      <!-- MEDIO DE PAGO -->
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;margin-bottom:8px">
        <button id="gas-banco-btn" onclick="setMedioGas('banco')"
          style="padding:9px;border-radius:10px;border:2px solid var(--blue);background:var(--blue-lt);color:var(--blue);font-weight:600;font-size:12px;cursor:pointer;font-family:'Inter',sans-serif">
          🏦 Banco
        </button>
        <button id="gas-efec-btn" onclick="setMedioGas('efectivo')"
          style="padding:9px;border-radius:10px;border:2px solid var(--border);background:var(--surface);color:var(--muted);font-weight:600;font-size:12px;cursor:pointer;font-family:'Inter',sans-serif">
          💵 Efectivo
        </button>
      </div>
      <button class="btn r" onclick="addGas()">+ Agregar</button>
    </div>`;

  cats.forEach(([cat,items],idx)=>{
    const tot=items.reduce((s,x)=>s+x.monto,0);
    const color=COLORS[idx%COLORS.length];
    html+=`<div style="margin-bottom:14px">
      <div class="cst">
        <span class="csn" style="color:${color}"><span class="dot" style="background:${color}"></span>${cat}</span>
        <span class="cstot" style="color:${color}">${fmt(tot)}</span>
      </div>
      ${items.map(g=>`
        <div class="item" style="border-left:3px solid ${color};opacity:${g.pagado?".65":"1"}">
          <div class="item-l">
            <div style="display:flex;align-items:center;gap:8px">
              <button onclick="togglePago(${g.id})" title="${g.pagado?"Marcar pendiente":"Marcar pagado"}"
                style="width:24px;height:24px;border-radius:50%;border:2px solid ${g.pagado?"var(--green)":color};background:${g.pagado?"var(--green)":"transparent"};cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;color:white;transition:all .2s">${g.pagado?"✓":""}</button>
              <div>
                <div class="item-desc" style="${g.pagado?"text-decoration:line-through;color:var(--muted)":""}">${g.desc}</div>
                <div class="item-sub">
                  ${g.cat}
                  ${g.fecha?` · <span style="font-size:9px;color:var(--muted)">${g.fecha} ${g.hora||""}</span>`:""}
                  · <span style="font-size:9px;font-weight:600;color:${g.pagado?"var(--green)":"var(--amber)"}">${g.pagado?"✓ PAG":"PEND"}</span>
                  · <span style="font-size:9px;font-weight:600;color:${(g.medio||'banco')==='efectivo'?'var(--amber)':'var(--blue)'}">${(g.medio||'banco')==='efectivo'?'💵':'🏦'}</span>
                </div>
              </div>
            </div>
          </div>
          <div class="item-r">
            <span style="font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:600;color:${color}">${fmt(g.monto)}</span>
            <button onclick="abrirModal('gas',${g.id})" class="ebtn">✏️</button>
            <button class="idel" onclick="delGas(${g.id})">✕</button>
          </div>
        </div>`).join("")}
    </div>`;
  });

  document.getElementById("page-egresos").innerHTML=html;
  if(!window._medioGas) window._medioGas="banco";
  setMedioGas(window._medioGas);
}

// ── RENDER AHORRO ────────────────────────────────────────────────────
function rAhorro(){
  const c=calcMes(mes,anio);
  const k=key(mes,anio);
  const pctMeta=META_AHORRO>0?Math.min((c.totSav/META_AHORRO)*100,100):0;
  const sav=c.sav;
  const destinos=sav.destinos||[];

  // Totales por destino globales (todos los meses)
  const totDest={invertido:0,dolarizado:0,efectivo:0};
  Object.values(D.ahorros||{}).forEach(s=>{
    (s.destinos||[]).forEach(d=>{
      if(totDest[d.tipo]!==undefined) totDest[d.tipo]+=d.monto||0;
    });
  });
  const totDestTotal=totDest.invertido+totDest.dolarizado+totDest.efectivo;

  // Totales por destino del mes
  const destMes={invertido:0,dolarizado:0,efectivo:0};
  destinos.forEach(d=>{ if(destMes[d.tipo]!==undefined) destMes[d.tipo]+=d.monto||0; });

  // acumulado histórico
  let acum=0;
  const mesesConDatos=[];
  for(let a=2024;a<=anio;a++){
    for(let m=0;m<12;m++){
      if(a===anio&&m>mes) break;
      const hc=calcMes(m,a);
      if(hc.totSav>0||hc.totIng>0){
        acum+=hc.totSav;
        mesesConDatos.push({m,a,sav:hc.totSav,acum});
      }
    }
  }

  const DEST=[
    {id:"invertido", lbl:"📈 Invertido",   color:"var(--blue)",   bg:"var(--blue-lt)"},
    {id:"dolarizado",lbl:"💵 Dolarizado",  color:"#1a7a3a",       bg:"#eaf7ee"},
    {id:"efectivo",  lbl:"💵 Efectivo",    color:"var(--amber)",  bg:"var(--amber-lt)"},
  ];

  const destiRows=destinos.map((d,i)=>{
    const def=DEST.find(x=>x.id===d.tipo)||DEST[0];
    return `<div style="display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border)">
      <div style="display:flex;align-items:center;gap:8px">
        <span style="font-size:13px">${def.lbl.split(" ")[0]}</span>
        <span style="font-size:12px;font-weight:500">${def.lbl.split(" ")[1]}</span>
        ${d.nota?`<span style="font-size:10px;color:var(--muted)">· ${d.nota}</span>`:""}
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <span style="font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:600;color:${def.color}">${fmt(d.monto)}</span>
        <button onclick="delDestino('${k}',${i})" class="idel">✕</button>
      </div>
    </div>`;
  }).join("");

  document.getElementById("page-ahorro").innerHTML=`
    <!-- CONFIGURAR AHORRO -->
    <div class="card accent-gold">
      <div class="card-title">Ahorro del mes · ${MC[mes]} ${anio}</div>
      <div class="sav-grid">
        <div class="sav-box main">
          <div class="sav-lbl">💰 Ahorro principal</div>
          <input class="sav-input" type="number" value="${sav.principal||0}" oninput="setSav('principal',this.value)" placeholder="0">
        </div>
        <div class="sav-box sec">
          <div class="sav-lbl">💚 Ahorro secundario</div>
          <input class="sav-input" type="number" value="${sav.secundario||0}" oninput="setSav('secundario',this.value)" placeholder="0">
        </div>
      </div>
      <div style="background:var(--light);border-radius:10px;padding:12px">
        <div class="dr"><span class="lbl">Ingresos totales</span><span class="val" style="color:var(--green)">${fmt(c.totIng)}</span></div>
        <div class="dr"><span class="lbl">Egresos totales</span><span class="val" style="color:var(--red)">− ${fmt(c.totEgr)}</span></div>
        <div class="dr"><span class="lbl">Ahorro principal</span><span class="val" style="color:var(--gold)">− ${fmt(sav.principal||0)}</span></div>
        <div class="dr"><span class="lbl">Ahorro secundario</span><span class="val" style="color:var(--green2)">− ${fmt(sav.secundario||0)}</span></div>
        <hr class="div">
        <div class="dr bold"><span class="lbl">Disponible libre</span><span class="val" style="color:${c.disponible>=0?"var(--blue)":"var(--red)"}">${fmt(c.disponible)}</span></div>
      </div>
    </div>

    <!-- DESTINO DEL AHORRO -->
    <div class="card">
      <div class="card-title">🏦 Destino del ahorro · ${MC[mes]} ${anio}</div>

      <!-- Agregar destino -->
      <div style="background:var(--light);border-radius:10px;padding:12px;margin-bottom:14px">
        <div style="font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px">Registrar destino</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px">
          <select class="fsel" id="dest-tipo" style="font-size:12px">
            ${DEST.map(d=>`<option value="${d.id}">${d.lbl}</option>`).join("")}
          </select>
          <input class="finp" type="number" id="dest-monto" placeholder="Monto $" style="font-size:12px">
        </div>
        <input class="finp" id="dest-nota" placeholder="Nota opcional (ej: Letes, USDT...)" style="font-size:12px;margin-bottom:8px">
        <button class="btn g" onclick="addDestino()">+ Registrar</button>
      </div>

      <!-- Lista destinos del mes -->
      ${destinos.length?destiRows:`<p style="color:var(--muted);font-size:12px;text-align:center;padding:12px">Sin destinos registrados este mes</p>`}

      <!-- Resumen del mes -->
      ${destinos.length?`
      <div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border)">
        <div style="font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:8px">Total asignado este mes</div>
        ${DEST.map(d=>`
          <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px">
            <span>${d.lbl}</span>
            <span style="font-family:'JetBrains Mono',monospace;font-weight:600;color:${d.color}">${fmt(destMes[d.id])}</span>
          </div>`).join("")}
      </div>`:""}
    </div>

    <!-- ACUMULADO POR DESTINO -->
    ${totDestTotal>0?`
    <div class="card">
      <div class="card-title">📊 Acumulado por destino · todos los meses</div>
      <div style="font-family:'Inter',sans-serif;font-size:28px;font-weight:500;color:var(--green);margin-bottom:14px">${fmt(totDestTotal)}</div>
      ${DEST.map(d=>`
        <div style="margin-bottom:10px">
          <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px">
            <span>${d.lbl}</span>
            <span style="font-family:'JetBrains Mono',monospace;font-size:11px;color:${d.color}">${fmt(totDest[d.id])} · ${totDestTotal?Math.round(totDest[d.id]/totDestTotal*100):0}%</span>
          </div>
          <div class="cat-bar-track">
            <div class="cat-bar-fill" style="width:${totDestTotal?(totDest[d.id]/totDestTotal*100).toFixed(1):0}%;background:${d.color}"></div>
          </div>
        </div>`).join("")}
    </div>`:""}

    <!-- META -->
    <div class="card">
      <div class="card-title">🎯 Meta mensual · ${fmt(META_AHORRO)}</div>
      <div class="ahorro-hero">
        <div class="ahorro-num" style="color:${pctMeta>=100?"var(--green)":"var(--amber)"}">${fmt(c.totSav)}</div>
        <div class="ahorro-sub">${c.metaOk?"¡Meta alcanzada este mes! 🎉":"Ahorro total del mes"}</div>
      </div>
      <div class="prog-track" style="margin-bottom:8px">
        <div class="prog-bar" style="width:${pctMeta}%;background:${pctMeta>=100?"var(--green)":"var(--amber)"}"></div>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--muted)">
        <span>${Math.round(pctMeta)}% de la meta</span>
        <span>${c.metaOk?`+${fmt(c.totSav-META_AHORRO)} extra`:`Faltan ${fmt(META_AHORRO-c.totSav)}`}</span>
      </div>
    </div>

    <!-- HISTÓRICO -->
    <div class="card">
      <div class="card-title">Acumulado total ahorrado</div>
      <div style="font-family:'Inter',sans-serif;font-size:32px;font-weight:500;color:var(--green);margin-bottom:16px">${fmt(acum)}</div>
      ${mesesConDatos.length>0?`
      <table class="hist-table">
        <thead><tr><th>Mes</th><th>Ahorro</th><th>Acumulado</th><th>Meta</th></tr></thead>
        <tbody>
          ${mesesConDatos.map(h=>`
            <tr>
              <td>${MC[h.m]} ${h.a}</td>
              <td class="${h.sav>=META_AHORRO?"met":"nom"}">${fmt(h.sav)}</td>
              <td>${fmt(h.acum)}</td>
              <td><span class="badge ${h.sav>=META_AHORRO?"ok":"no"}">${h.sav>=META_AHORRO?"✓":"✗"}</span></td>
            </tr>`).join("")}
        </tbody>
      </table>`:`<p style="color:var(--muted);font-size:12px;text-align:center;padding:16px">Cargá ahorros en los distintos meses para ver el acumulado</p>`}
    </div>
    <div style="margin-bottom:24px"></div>
  `;
}

// ── RENDER TARJETA ───────────────────────────────────────────────────
function rTC(){
  const tcM=D.tarjetas.filter(t=>t.mes===mes&&t.anio===anio);

  // Desglose agrupado por categoría (suma de todas las TC)
  const catMap={};
  tcM.forEach(t=>{
    (t.detalle||[]).forEach(d=>{
      catMap[d.cat]=(catMap[d.cat]||0)+d.monto;
    });
  });
  const cats=Object.entries(catMap).sort((a,b)=>b[1]-a[1]);
  const totTC=tcM.reduce((s,t)=>s+(t.total||0),0);

  let desgloseHtml="";
  if(cats.length){
    desgloseHtml=`
      <div class="card">
        <div class="card-title">Desglose por categoría · todas las TC</div>
        <div style="margin-bottom:12px">
          ${cats.map(([cat,tot],i)=>`
            <div style="margin-bottom:10px">
              <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px">
                <span><span class="dot" style="background:${COLORS[i%COLORS.length]}"></span>${cat}</span>
                <span style="font-family:'JetBrains Mono',monospace;font-size:11px;color:${COLORS[i%COLORS.length]}">${fmt(tot)}</span>
              </div>
              <div class="cat-bar-track"><div class="cat-bar-fill" style="width:${totTC?(tot/totTC*100).toFixed(1):0}%;background:${COLORS[i%COLORS.length]}"></div></div>
              <div style="font-size:10px;color:var(--muted);margin-top:2px">${totTC?Math.round(tot/totTC*100):0}% del total TC</div>
            </div>`).join("")}
        </div>
      </div>`;
  }

  let tcCards=tcM.map(t=>`
    <div class="card" style="border-left:3px solid ${t.persona==="Ivan"?"var(--ivan)":"var(--noelia)"}">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <div>
          <div style="font-size:13px;font-weight:600">${t.desc}</div>
          <div style="font-size:10px;color:var(--muted)">${t.persona}</div>
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          <span style="font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:600;color:${t.persona==="Ivan"?"var(--ivan)":"var(--noelia)"}">${fmt(t.total)}</span>
          <button class="idel" onclick="delTC('${t.id}')" title="Eliminar tarjeta">✕</button>
        </div>
      </div>
      ${(t.detalle||[]).map((d,i)=>`
        <div style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--border)">
          <div style="display:flex;align-items:center;gap:7px">
            <span class="dot" style="background:${COLORS[i%COLORS.length]}"></span>
            <span style="font-size:12px">${d.cat}</span>
          </div>
          <span style="font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:500;color:${COLORS[i%COLORS.length]}">${fmt(d.monto)}</span>
        </div>`).join("")}
    </div>`).join("");

  document.getElementById("page-tc").innerHTML=`
    <div class="card" style="padding:12px 16px;margin-bottom:12px">
      <span style="font-size:12px;color:var(--muted)">Total tarjetas ${MC[mes]}: </span>
      <span style="font-size:17px;font-weight:600;font-family:'JetBrains Mono',monospace;color:var(--blue)">${fmt(totTC)}</span>
    </div>

    <!-- UPLOAD -->
    <div class="tc-upload" onclick="document.getElementById('tc-file').click()">
      <input type="file" id="tc-file" accept="image/*,.pdf" onchange="procesarTC(this)">
      <div class="tc-upload-ico">📄</div>
      <div class="tc-upload-txt">Subir resumen de tarjeta</div>
      <div class="tc-upload-sub">Foto o PDF · Claude analiza y categoriza automáticamente</div>
    </div>

    <!-- CARGA MANUAL -->
    <div class="card">
      <div class="card-title">+ Cargar TC manualmente</div>
      <div class="fg frow">
        <input class="finp" id="tc-desc" placeholder="Nombre (ej: TC Ivan)">
        <select class="fsel" id="tc-per"><option>Ivan</option><option>Noelia</option></select>
      </div>
      <div class="fg"><input class="finp" id="tc-total" type="number" placeholder="Total $"></div>
      <div id="tc-det-list"></div>
      <button class="btn b" style="margin-bottom:8px" onclick="addTCDet()">+ Agregar ítem de desglose</button>
      <button class="btn g" onclick="savTC()">Guardar tarjeta</button>
    </div>

window.delTCItem=function(tcId,cat,itemIdx){
  const tc=D.tarjetas.find(t=>t.id===tcId);
  if(!tc)return;
  // Remove from items (individual transactions)
  if(tc.items&&tc.items.length>0){
    const catItems=tc.items.filter(i=>i.cat===cat);
    if(catItems[itemIdx]){
      const globalIdx=tc.items.indexOf(catItems[itemIdx]);
      tc.items.splice(globalIdx,1);
    }
  }
  // Update detalle total for this cat
  if(tc.detalle){
    const remaining=tc.items?tc.items.filter(i=>i.cat===cat).reduce((s,i)=>s+i.monto,0):0;
    const det=tc.detalle.find(d=>d.cat===cat);
    if(det){
      if(remaining<=0) tc.detalle=tc.detalle.filter(d=>d.cat!==cat);
      else det.monto=remaining;
    }
    tc.total=tc.detalle.reduce((s,d)=>s+d.monto,0);
  }
  save();renderAll();
}

// ── TC: PROCESAR CON AI ──────────────────────────────────────────────
window.procesarTC=async function(input){
  if(!input.files[0])return;
  const file=input.files[0];
  syncBanner("saving","🤖 Analizando resumen con IA...");

  // Leer como base64
  const b64=await new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>res(r.result.split(",")[1]);
    r.onerror=()=>rej();
    r.readAsDataURL(file);
  });

  const isPDF=file.type==="application/pdf";
  const mediaType=isPDF?"application/pdf":file.type;

  const body={
    model:"claude-sonnet-4-20250514",
    max_tokens:1000,
    messages:[{
      role:"user",
      content:[
        isPDF
          ?{type:"document",source:{type:"base64",media_type:mediaType,data:b64}}
          :{type:"image",source:{type:"base64",media_type:mediaType,data:b64}},
        {type:"text",text:`Analizá este resumen de tarjeta de crédito. Extraé: 1) El total del resumen 2) El nombre del titular o banco 3) Un desglose de gastos agrupados por estas categorías: ${CAT_TC.join(", ")}. Respondé SOLO con JSON sin texto extra ni backticks, con este formato exacto: {"titular":"nombre","total":0,"detalle":[{"cat":"Supermercado","monto":0}]}`}
      ]
    }]
  };

  try{
    const resp=await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(body)
    });
    const data=await resp.json();
    const txt=data.content.map(x=>x.text||"").join("").replace(/```json|```/g,"").trim();
    const parsed=JSON.parse(txt);

    D.tarjetas.push({
      id:"tc"+Date.now(),
      desc:parsed.titular||file.name,
      persona:"Ivan",
      total:parsed.total||0,
      mes,anio,
      detalle:parsed.detalle||[]
    });
    save();renderAll();
    syncBanner("ok","✓ Tarjeta analizada y cargada");
  }catch(e){
    syncBanner("error","⚠️ Error al analizar · cargá manualmente");
    console.error(e);
  }
  input.value="";
}

function rDesglose(){
  const tcM=D.tarjetas.filter(t=>t.mes===mes&&t.anio===anio);
  const COLORS_CAT={
    "Auto/Transporte":"#1a3d7a","Educación":"#1a5c3a","Ropa/Calzado":"#6b2d8b",
    "Seguros":"#a06000","Suscripciones":"#0891b2","Salud":"#b83232",
    "Servicios":"#be185d","Compras Online":"#5c4a1a","Supermercado":"#2d7a52","Otros":"#6b7280"
  };

  // Agrupar todos los ítems de todas las TC
  const allItems=[];
  tcM.forEach(t=>(t.items||[]).forEach(i=>allItems.push({...i,tc:t.desc,persona:t.persona,tcId:t.id})));

  // Agrupar por categoría para resumen
  const catMap={};
  tcM.forEach(t=>(t.detalle||[]).forEach(d=>{catMap[d.cat]=(catMap[d.cat]||0)+d.monto;}));
  const cats=Object.entries(catMap).sort((a,b)=>b[1]-a[1]);
  const totTC=tcM.reduce((s,t)=>s+(t.total||0),0);

  // Agrupar ítems por categoría para tabla
  const itemsByCat={};
  allItems.forEach(i=>{
    if(!itemsByCat[i.cat])itemsByCat[i.cat]=[];
    itemsByCat[i.cat].push(i);
  });

  let catSections=cats.map(([cat,tot],idx)=>{
    const color=COLORS_CAT[cat]||COLORS[idx%COLORS.length];
    const items=itemsByCat[cat]||[];
    const rows=items.map((i,itemIdx)=>`
      <div class="item" style="border-left:none;border-bottom:1px solid var(--border);border-radius:0;margin-bottom:0;padding:8px 0">
        <div class="item-l">
          <div style="font-size:12px;font-weight:500">${i.desc}</div>
          <div style="font-size:10px;color:var(--muted)">${i.fecha||""} · ${i.tc}</div>
        </div>
        <div class="item-r">
          <span style="font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:500;color:${color}">
            ${i.usd?`USD ${i.monto}`:fmt(i.monto)}
          </span>
          <button class="idel" onclick="delTCItem('${i.tcId||""}','${i.cat}',${itemIdx})" title="Eliminar ítem">✕</button>
        </div>
      </div>`).join("");
    return `
      <div class="card" style="margin-bottom:10px;border-left:3px solid ${color}">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:${items.length?10:0}px">
          <span style="font-size:12px;font-weight:600;color:${color}"><span class="dot" style="background:${color}"></span>${cat}</span>
          <span style="font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:600;color:${color}">${fmt(tot)}</span>
        </div>
        ${rows}
      </div>`;
  }).join("");

  document.getElementById("page-desglose").innerHTML=`
    <!-- RESUMEN VISUAL -->
    <div class="card accent-gold">
      <div class="card-title">Resumen TC · ${MC[mes]} ${anio}</div>
      <div style="font-family:'Inter',sans-serif;font-size:28px;font-weight:500;color:var(--blue);margin-bottom:14px">${fmt(totTC)}</div>
      ${cats.map(([cat,tot],i)=>{
        const color=COLORS_CAT[cat]||COLORS[i%COLORS.length];
        return `<div style="margin-bottom:9px">
          <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px">
            <span><span class="dot" style="background:${color}"></span>${cat}</span>
            <span style="font-family:'JetBrains Mono',monospace;font-size:11px;color:${color}">${fmt(tot)} · ${totTC?Math.round(tot/totTC*100):0}%</span>
          </div>
          <div class="cat-bar-track"><div class="cat-bar-fill" style="width:${totTC?(tot/totTC*100).toFixed(1):0}%;background:${color}"></div></div>
        </div>`;
      }).join("")}
    </div>

    <!-- DETALLE POR CATEGORÍA -->
    <div class="sec-hdr">Detalle por categoría</div>
    ${catSections||`<p style="color:var(--muted);text-align:center;font-size:12px;padding:20px">Sin datos de TC para este mes</p>`}
    <div style="margin-bottom:24px"></div>
  `;
}

function crearBackup(){
  const backups=JSON.parse(localStorage.getItem("fi-backups")||"[]");
  const snap={
    fecha:new Date().toLocaleString("es-AR"),
    ts:Date.now(),
    data:JSON.parse(JSON.stringify(D))
  };
  backups.unshift(snap);
  // Guardar solo los últimos 10 backups
  if(backups.length>10) backups.splice(10);
  localStorage.setItem("fi-backups",JSON.stringify(backups));
  return snap.fecha;
}

function listarBackups(){
  return JSON.parse(localStorage.getItem("fi-backups")||"[]");
}

window.hacerBackup=function(){
  const fecha=crearBackup();
  syncBanner("ok",`✓ Backup creado · ${fecha}`);
  rAjustes();
}

window.restaurarBackup=function(ts){
  const backups=listarBackups();
  const b=backups.find(x=>x.ts===ts);
  if(!b)return;
  if(!confirm(`¿Restaurar backup del ${b.fecha}? Los datos actuales se reemplazarán.`))return;
  D=JSON.parse(JSON.stringify(b.data));
  save();
  renderAll();
  syncBanner("ok",`✓ Backup del ${b.fecha} restaurado`);
}

window.eliminarBackup=function(ts){
  let backups=listarBackups();
  backups=backups.filter(x=>x.ts!==ts);
  localStorage.setItem("fi-backups",JSON.stringify(backups));
  rAjustes();
}

window.importarJSON=function(){
  const input=document.createElement("input");
  input.type="file";
  input.accept=".json";
  input.onchange=e=>{
    const file=e.target.files[0];
    if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const parsed=JSON.parse(ev.target.result);
        if(!parsed.ingresos||!parsed.gastos) throw new Error("Formato inválido");
        crearBackup(); // backup antes de importar
        D=parsed;
        save();
        renderAll();
        syncBanner("ok","✓ Datos importados correctamente");
      }catch(err){
        syncBanner("error","⚠️ Archivo inválido");
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

const PIN="130221";
let pinInput="";
function pinPress(d){ pinInput+=d; updatePinDots(); if(pinInput.length===6) pinSubmit(); }
function pinClear(){ pinInput=pinInput.slice(0,-1); updatePinDots(); document.getElementById("pinErr").textContent=""; }
function pinSubmit(){
  if(pinInput===PIN){
    document.getElementById("lockScreen").classList.add("hidden");
    document.getElementById("pinErr").textContent="";
  } else {
    document.getElementById("pinErr").textContent="PIN incorrecto";
    pinInput="";
    updatePinDots();
    setTimeout(()=>{document.getElementById("pinErr").textContent="";},1500);
  }
}
function updatePinDots(){
  for(let i=0;i<6;i++){
    document.getElementById(`pd${i}`).classList.toggle("filled",i<pinInput.length);
  }
}
window.pinPress=pinPress; window.pinClear=pinClear; window.pinSubmit=pinSubmit;

// ── RENDER GRÁFICOS ───────────────────────────────────────────────────
function rGraficos(){
  // Recopilar últimos 6 meses con datos
  const histData=[];
  for(let i=5;i>=0;i--){
    let hm=mes-i, ha=anio;
    while(hm<0){hm+=12;ha--;}
    const hc=calcMes(hm,ha);
    histData.push({m:hm,a:ha,c:hc,lbl:MC[hm]});
  }

  const maxVal=Math.max(...histData.map(h=>Math.max(h.c.totIng,h.c.totEgr)),1);
  const W=320, H=140, PAD=10, BAR=28, GAP=16;

  // Barras ing/egr últimos 6 meses
  let ingBars="",egrBars="",xLabels="",valLabels="";
  histData.forEach((h,i)=>{
    const x=PAD+i*(BAR*2+GAP);
    const ingH=Math.max(4,Math.round((h.c.totIng/maxVal)*(H-20)));
    const egrH=Math.max(4,Math.round((h.c.totEgr/maxVal)*(H-20)));
    ingBars+=`<rect x="${x}" y="${H-ingH}" width="${BAR}" height="${ingH}" rx="4" fill="var(--green)" opacity=".85"/>`;
    egrBars+=`<rect x="${x+BAR+2}" y="${H-egrH}" width="${BAR}" height="${egrH}" rx="4" fill="var(--red)" opacity=".8"/>`;
    xLabels+=`<text x="${x+BAR}" y="${H+16}" text-anchor="middle" font-size="9" fill="var(--muted)" font-family="DM Sans">${h.lbl}</text>`;
  });

  // Proyección próximo mes (promedio 3 meses)
  const last3Ing=histData.slice(-3).map(h=>h.c.totIng).filter(v=>v>0);
  const last3Egr=histData.slice(-3).map(h=>h.c.totEgr).filter(v=>v>0);
  const proyIng=last3Ing.length?Math.round(last3Ing.reduce((a,b)=>a+b,0)/last3Ing.length):0;
  const proyEgr=last3Egr.length?Math.round(last3Egr.reduce((a,b)=>a+b,0)/last3Egr.length):0;
  const proyDisp=proyIng-proyEgr;

  // Donut categorías del mes actual
  const c=calcMes(mes,anio);
  const cats=c.cats.slice(0,6);
  const totCat=cats.reduce((s,[,v])=>s+v,0)||1;
  let donutPaths="",donutLegend="";
  let angle=0;
  cats.forEach(([cat,val],i)=>{
    const pct=val/totCat;
    const a1=angle*Math.PI/180;
    const a2=(angle+pct*360)*Math.PI/180;
    const x1=50+40*Math.cos(a1), y1=50+40*Math.sin(a1);
    const x2=50+40*Math.cos(a2), y2=50+40*Math.sin(a2);
    const large=pct>0.5?1:0;
    donutPaths+=`<path d="M50,50 L${x1},${y1} A40,40 0 ${large},1 ${x2},${y2} Z" fill="${COLORS[i%COLORS.length]}" opacity=".9"/>`;
    donutLegend+=`<div style="display:flex;align-items:center;gap:6px;margin-bottom:5px;font-size:11px">
      <span style="width:10px;height:10px;border-radius:3px;background:${COLORS[i%COLORS.length]};flex-shrink:0"></span>
      <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)">${cat}</span>
      <span style="font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted)">${Math.round(pct*100)}%</span>
    </div>`;
    angle+=pct*360;
  });

  // Indicadores
  const cAct=calcMes(mes,anio);
  const tasaAhorro=cAct.totIng>0?Math.round((cAct.totSav/cAct.totIng)*100):0;
  const tasaGasto =cAct.totIng>0?Math.round((cAct.totEgr/cAct.totIng)*100):0;
  const prevMes=mes>0?calcMes(mes-1,anio):calcMes(11,anio-1);
  const varIng=prevMes.totIng>0?Math.round(((cAct.totIng-prevMes.totIng)/prevMes.totIng)*100):0;
  const varEgr=prevMes.totEgr>0?Math.round(((cAct.totEgr-prevMes.totEgr)/prevMes.totEgr)*100):0;

  document.getElementById("page-graficos").innerHTML=`
    <!-- INDICADORES -->
    <div class="card">
      <div class="card-title">📊 Indicadores · ${MC[mes]} ${anio}</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <div style="background:var(--light);border-radius:12px;padding:12px;text-align:center">
          <div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">Tasa de ahorro</div>
          <div style="font-size:28px;font-weight:600;font-family:'JetBrains Mono',monospace;color:${tasaAhorro>=20?"var(--green)":"var(--amber)"}">${tasaAhorro}%</div>
          <div style="font-size:10px;color:var(--muted);margin-top:2px">${tasaAhorro>=20?"✅ Saludable":"⚠️ Mejorable"}</div>
        </div>
        <div style="background:var(--light);border-radius:12px;padding:12px;text-align:center">
          <div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">Gasto/Ingreso</div>
          <div style="font-size:28px;font-weight:600;font-family:'JetBrains Mono',monospace;color:${tasaGasto<=70?"var(--green)":"var(--red)"}">${tasaGasto}%</div>
          <div style="font-size:10px;color:var(--muted);margin-top:2px">${tasaGasto<=70?"✅ Controlado":"⚠️ Alto"}</div>
        </div>
        <div style="background:var(--light);border-radius:12px;padding:12px;text-align:center">
          <div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">Var. ingresos</div>
          <div style="font-size:22px;font-weight:600;font-family:'JetBrains Mono',monospace;color:${varIng>=0?"var(--green)":"var(--red)"}">${varIng>=0?"+":""}${varIng}%</div>
          <div style="font-size:10px;color:var(--muted);margin-top:2px">vs mes anterior</div>
        </div>
        <div style="background:var(--light);border-radius:12px;padding:12px;text-align:center">
          <div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">Var. egresos</div>
          <div style="font-size:22px;font-weight:600;font-family:'JetBrains Mono',monospace;color:${varEgr<=0?"var(--green)":"var(--red)"}">${varEgr>=0?"+":""}${varEgr}%</div>
          <div style="font-size:10px;color:var(--muted);margin-top:2px">vs mes anterior</div>
        </div>
      </div>
    </div>

    <!-- BARRAS HISTÓRICO -->
    <div class="card">
      <div class="card-title">📊 Ingresos vs Egresos · últimos 6 meses</div>
      <div style="overflow-x:auto">
        <svg width="${PAD*2+histData.length*(BAR*2+GAP)-GAP+BAR}" height="${H+30}" viewBox="0 0 ${PAD*2+histData.length*(BAR*2+GAP)-GAP+BAR} ${H+30}" style="display:block">
          ${ingBars}${egrBars}${xLabels}
        </svg>
      </div>
      <div style="display:flex;gap:14px;margin-top:6px">
        <div style="display:flex;align-items:center;gap:5px;font-size:10px;color:var(--muted)"><span style="width:10px;height:8px;background:var(--green);border-radius:2px;display:inline-block;opacity:.85"></span>Ingresos</div>
        <div style="display:flex;align-items:center;gap:5px;font-size:10px;color:var(--muted)"><span style="width:10px;height:8px;background:var(--red);border-radius:2px;display:inline-block;opacity:.8"></span>Egresos</div>
      </div>
    </div>

    <!-- DONUT CATEGORÍAS -->
    <div class="card">
      <div class="card-title">🥧 Egresos por categoría · ${MC[mes]} ${anio}</div>
      <div style="display:flex;gap:16px;align-items:center">
        <svg width="100" height="100" viewBox="0 0 100 100" style="flex-shrink:0">
          ${donutPaths}
          <circle cx="50" cy="50" r="22" fill="var(--surface)"/>
          <text x="50" y="53" text-anchor="middle" font-size="9" fill="var(--muted)" font-family="DM Sans">${fmt(cAct.totEgr).replace("$","$\n")}</text>
        </svg>
        <div style="flex:1;min-width:0">${donutLegend}</div>
      </div>
    </div>

    <!-- PROYECCIONES -->
    <div class="card accent-gold">
      <div class="card-title">🔮 Proyección próximo mes</div>
      <div style="font-size:11px;color:var(--muted);margin-bottom:12px">Basado en promedio de los últimos 3 meses</div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">
        <div style="background:var(--light);border-radius:10px;padding:10px;text-align:center">
          <div style="font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">Ingresos est.</div>
          <div style="font-size:14px;font-weight:600;font-family:'JetBrains Mono',monospace;color:var(--green)">${fmt(proyIng)}</div>
        </div>
        <div style="background:var(--light);border-radius:10px;padding:10px;text-align:center">
          <div style="font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">Egresos est.</div>
          <div style="font-size:14px;font-weight:600;font-family:'JetBrains Mono',monospace;color:var(--red)">${fmt(proyEgr)}</div>
        </div>
        <div style="background:var(--light);border-radius:10px;padding:10px;text-align:center">
          <div style="font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">Disponible est.</div>
          <div style="font-size:14px;font-weight:600;font-family:'JetBrains Mono',monospace;color:${proyDisp>=0?"var(--green)":"var(--red)"}">${fmt(proyDisp)}</div>
        </div>
      </div>
      ${proyIng>0?`
      <div style="margin-top:12px;font-size:11px;color:var(--muted)">
        Ahorro proyectado: <span style="font-weight:600;color:var(--amber);font-family:'JetBrains Mono',monospace">${fmt(Math.max(0,proyDisp))}</span>
        ${proyDisp>=META_AHORRO?` · <span style="color:var(--green)">✅ Supera la meta de ${fmt(META_AHORRO)}</span>`:`· <span style="color:var(--red)">Faltan ${fmt(META_AHORRO-proyDisp)} para la meta</span>`}
      </div>`:""}
    </div>
    <div style="margin-bottom:24px"></div>
  `;
}

function updateMini(){
  const c=calcMes(mes,anio);
  const fmtM=n=>{
    const abs=Math.abs(n);
    const str=abs>=1000000?(abs/1000000).toFixed(1)+"M":(abs>=1000?(abs/1000).toFixed(0)+"k":String(Math.round(abs)));
    return (n<0?"-":"")+"$"+str;
  };
  document.getElementById("mini-ing").textContent=fmtM(c.totIng);
  document.getElementById("mini-egr").textContent=fmtM(c.totEgr);
  const disp=document.getElementById("mini-disp");
  disp.textContent=fmtM(c.disponible);
  disp.style.color=c.disponible>=0?"var(--amber)":"var(--red)";
  const dispBox=disp.parentElement;
  dispBox.style.background=c.disponible>=0?"var(--gold-lt)":"var(--red-lt)";
  dispBox.style.borderColor=c.disponible>=0?"#f0d9a0":"#f5c6c6";
  dispBox.querySelector("div").style.color=c.disponible>=0?"var(--amber)":"var(--red)";
}

  let obj=null;
  if(tipo==="ing") obj=D.ingresos.find(i=>i.id===id);
  else if(tipo==="gas") obj=D.gastos.find(g=>g.id===id);
  else if(tipo==="ef") obj=(D.efectivo||[]).find(m=>m.id===id);
  if(!obj)return;

  _emTipo=tipo; _emId=id;
  _emMedio=obj.medio||"banco";
  _emPersona=obj.persona||"Ivan";

  // Title
  const titles={ing:"✏️ Editar Ingreso",gas:"✏️ Editar Egreso",ef:"✏️ Editar Efectivo"};
  document.getElementById("editModalTitle").textContent=titles[tipo]||"✏️ Editar";
  document.getElementById("em-desc").value=obj.desc||"";
  document.getElementById("em-monto").value=obj.monto||"";

  // Categorías
  const cats=tipo==="ing"?CAT_ING:tipo==="gas"?CAT_GAS:["Ingreso","Gasto","Retiro ATM","Transferencia","Otros"];
  const catSel=document.getElementById("em-cat");
  catSel.innerHTML=cats.map(c=>`<option ${c===obj.cat?"selected":""}>${c}</option>`).join("");

  // Persona — mostrar en ing y ef
  document.getElementById("em-persona-wrap").style.display=(tipo==="ing"||tipo==="ef")?"block":"none";

  // Medio — ocultar en ef (el tipo entrada/salida ya define la dirección)
  document.getElementById("em-medio-wrap").style.display=tipo==="ef"?"none":"block";

  setEmMedio(_emMedio);
  setEmPersona(_emPersona);
  document.getElementById("editModal").classList.remove("hidden");
}

window.cerrarModal=function(){
  document.getElementById("editModal").classList.add("hidden");
  _emTipo=null; _emId=null;
}

window.guardarModal=function(){
  if(!_emTipo||!_emId)return;
  const desc=document.getElementById("em-desc").value.trim();
  const monto=parseFloat(document.getElementById("em-monto").value);
  const cat=document.getElementById("em-cat").value;
  if(!desc||isNaN(monto)||monto<=0){cerrarModal();return;}

  if(_emTipo==="ing"){
    const i=D.ingresos.find(x=>x.id===_emId);
    if(i){i.desc=desc;i.monto=monto;i.cat=cat;i.persona=_emPersona;i.medio=_emMedio;}
  } else if(_emTipo==="gas"){
    const g=D.gastos.find(x=>x.id===_emId);
    if(g){g.desc=desc;g.monto=monto;g.cat=cat;g.medio=_emMedio;}
  } else if(_emTipo==="ef"){
    const m=(D.efectivo||[]).find(x=>x.id===_emId);
    if(m){m.desc=desc;m.monto=monto;m.cat=cat;m.persona=_emPersona;}
  }
  save(); cerrarModal(); renderAll();
}

window.setEmMedio=function(m){
  _emMedio=m;
  const bb=document.getElementById("em-banco-btn");
  const be=document.getElementById("em-efec-btn");
  if(!bb||!be)return;
  bb.className="mbtn"+(m==="banco"?" active-banco":"");
  be.className="mbtn"+(m==="efectivo"?" active-efectivo":"");
}

window.setEmPersona=function(p){
  _emPersona=p;
  const bi=document.getElementById("em-ivan-btn");
  const bn=document.getElementById("em-noelia-btn");
  if(!bi||!bn)return;
  bi.className="mbtn"+(p==="Ivan"?" active-ivan":"");
  bn.className="mbtn"+(p==="Noelia"?" active-noelia":"");
}

// Cerrar modal tocando fuera
document.getElementById("editModal").addEventListener("click",e=>{
  if(e.target===document.getElementById("editModal")) cerrarModal();
});

// ── TOGGLE PAGO ──────────────────────────────────────────────────────
window.togglePago=function(id){
  const g=D.gastos.find(x=>x.id===id);
  if(!g)return;
  g.pagado=!g.pagado;
  if(g.pagado){
    const ts=new Date();
    g.fechaPago=ts.toLocaleDateString("es-AR")+" "+ts.toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"});
  } else {
    delete g.fechaPago;
  }
  save();rEgresos();updateMini();
}

// ── RENDER EFECTIVO ───────────────────────────────────────────────────
function rEfectivo(){
  const movs=D.efectivo||[];

  // Calcular saldo efectivo: manuales + auto de ingresos/gastos
  const entradas=movs.filter(m=>m.tipo==="entrada").reduce((s,m)=>s+m.monto,0);
  const salidas =movs.filter(m=>m.tipo==="salida").reduce((s,m)=>s+m.monto,0);
  const saldoEfectivo=entradas-salidas;

  // Calcular saldo banco: ingresos banco - gastos banco - TC pagados
  const ingBanco=D.ingresos.filter(i=>(i.medio||"banco")==="banco").reduce((s,i)=>s+i.monto,0);
  const gasBanco=D.gastos.filter(g=>(g.medio||"banco")==="banco").reduce((s,g)=>s+g.monto,0);
  const tcTotal =D.tarjetas.reduce((s,t)=>s+(t.total||0),0);
  const saldoBanco=ingBanco-gasBanco-tcTotal;

  // Últimos 40 movimientos ordenados más reciente primero
  const recent=[...movs].reverse().slice(0,40);

  const movRows=recent.map(m=>`
    <div class="item" style="border-left:3px solid ${m.tipo==="entrada"?"var(--green)":"var(--red)"}">
      <div class="item-l">
        <div class="item-desc" style="${m.auto?"font-style:italic;":""}">
          ${m.desc||"Sin descripción"}
          ${m.auto?`<span style="font-size:9px;background:var(--light);color:var(--muted);padding:1px 5px;border-radius:4px;margin-left:4px">auto</span>`:""}
        </div>
        <div class="item-sub">
          ${m.persona?m.persona+" · ":""}${m.fecha||""} ${m.hora||""}
          ${m.nota?`· ${m.nota}`:""}
        </div>
      </div>
      <div class="item-r">
        <span style="font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;color:${m.tipo==="entrada"?"var(--green)":"var(--red)"}">
          ${m.tipo==="entrada"?"+":"-"}${fmt(m.monto)}
        </span>
        <button onclick="abrirModal('ef','${m.id}')" class="ebtn">✏️</button>
        <button class="idel" onclick="delEfectivo('${m.id}')">✕</button>
      </div>
    </div>`).join("");

  document.getElementById("page-efectivo").innerHTML=`
    <!-- SALDOS HERO -->
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px">
      <!-- EFECTIVO -->
      <div style="background:${saldoEfectivo>=0?"var(--amber)":"var(--red)"};border-radius:16px;padding:16px;box-shadow:var(--sh2)">
        <div style="font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:rgba(255,255,255,.65);margin-bottom:4px">💵 Efectivo</div>
        <div style="font-size:24px;font-weight:700;color:#fff;letter-spacing:-.5px;line-height:1">${fmt(saldoEfectivo)}</div>
        <div style="font-size:9px;color:rgba(255,255,255,.65);margin-top:5px">+${fmt(entradas)} −${fmt(salidas)}</div>
      </div>
      <!-- BANCO -->
      <div style="background:${saldoBanco>=0?"var(--blue)":"var(--red)"};border-radius:16px;padding:16px;box-shadow:var(--sh2)">
        <div style="font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:rgba(255,255,255,.65);margin-bottom:4px">🏦 Banco est.</div>
        <div style="font-size:24px;font-weight:700;color:#fff;letter-spacing:-.5px;line-height:1">${fmt(saldoBanco)}</div>
        <div style="font-size:9px;color:rgba(255,255,255,.65);margin-top:5px">Ing−Gas−TC</div>
      </div>
    </div>

    <!-- DETALLE BANCO -->
    <div class="card" style="margin-bottom:12px">
      <div class="card-title">🏦 Desglose bancario</div>
      <div class="dr"><span class="lbl">Ingresos bancarios</span><span class="val" style="color:var(--green)">${fmt(ingBanco)}</span></div>
      <div class="dr"><span class="lbl">Gastos bancarios</span><span class="val" style="color:var(--red)">− ${fmt(gasBanco)}</span></div>
      <div class="dr"><span class="lbl">Tarjetas de crédito</span><span class="val" style="color:var(--red)">− ${fmt(tcTotal)}</span></div>
      <hr class="div">
      <div class="dr bold"><span class="lbl">Saldo estimado banco</span><span class="val" style="color:${saldoBanco>=0?"var(--blue)":"var(--red)"}">${fmt(saldoBanco)}</span></div>
    </div>

    <!-- FORMULARIO -->
    <div class="card">
      <div class="card-title">+ Registrar movimiento de efectivo</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px">
        <button id="btn-entrada" onclick="setTipoEfectivo('entrada')"
          style="padding:10px;border-radius:10px;border:2px solid var(--green);background:var(--green-lt);color:var(--green);font-weight:600;font-size:12px;cursor:pointer;font-family:'Inter',sans-serif">
          ↑ Entrada
        </button>
        <button id="btn-salida" onclick="setTipoEfectivo('salida')"
          style="padding:10px;border-radius:10px;border:2px solid var(--border);background:var(--surface);color:var(--muted);font-weight:600;font-size:12px;cursor:pointer;font-family:'Inter',sans-serif">
          ↓ Salida
        </button>
      </div>
      <div class="fg"><input class="finp" id="ef-desc" placeholder="Descripción (ej: Retiro ATM, Pago taxi...)"></div>
      <div class="fg frow" style="margin-top:8px">
        <input class="finp" id="ef-monto" type="number" placeholder="Monto $">
        <select class="fsel" id="ef-persona"><option>Ivan</option><option>Noelia</option></select>
      </div>
      <div class="fg" style="margin-top:8px"><input class="finp" id="ef-nota" placeholder="Nota opcional"></div>
      <button class="btn g" style="margin-top:8px" onclick="addEfectivo()">+ Registrar</button>
    </div>

    <!-- MOVIMIENTOS -->
    <div style="font-size:13px;font-weight:600;color:var(--text);margin:4px 0 10px">
      Movimientos · ${movs.length} registros
      <span style="font-size:10px;color:var(--muted);font-weight:400"> · "auto" = generado desde ingresos/egresos</span>
    </div>
    ${movRows||`<div style="text-align:center;color:var(--muted);font-size:12px;padding:24px">Sin movimientos aún</div>`}
    <div style="margin-bottom:24px"></div>
  `;

  if(!window._tipoEfectivo) window._tipoEfectivo="entrada";
  setTipoEfectivo(window._tipoEfectivo);
}

window.addEfectivo=function(){
  const desc   =document.getElementById("ef-desc").value.trim();
  const monto  =parseFloat(document.getElementById("ef-monto").value);
  const persona=document.getElementById("ef-persona").value;
  const nota   =document.getElementById("ef-nota").value.trim();
  if(!desc||isNaN(monto)||monto<=0)return;
  const ts=new Date();
  if(!D.efectivo)D.efectivo=[];
  D.efectivo.push({
    id:"ef"+Date.now(),
    desc,tipo:window._tipoEfectivo,monto,persona,nota,
    fecha:ts.toLocaleDateString("es-AR"),
    hora:ts.toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"})
  });
  document.getElementById("ef-desc").value="";
  document.getElementById("ef-monto").value="";
  document.getElementById("ef-nota").value="";
  save();rEfectivo();
}

window.delEfectivo=function(id){
  D.efectivo=D.efectivo.filter(m=>m.id!==id);
  save();rEfectivo();
}

function renderAll(){
  rResumen();
  updateMini();
  const pages=["ingresos","egresos","ahorro","tc","desglose","efectivo","ajustes"];
  pages.forEach(p=>{
    if(!document.getElementById(`page-${p}`).classList.contains("on"))return;
    if(p==="ingresos") rIngresos();
    if(p==="egresos")  rEgresos();
    if(p==="ahorro")   rAhorro();
    if(p==="tc")       rTC();
    if(p==="desglose") rDesglose();
    if(p==="efectivo") rEfectivo();
    if(p==="ajustes")  rAjustes();
  });
}

// ── TABS ──────────────────────────────────────────────────────────────
document.querySelectorAll(".tb").forEach(btn=>{
  btn.addEventListener("click",()=>{
    document.querySelectorAll(".tb").forEach(b=>b.classList.remove("on"));
    btn.classList.add("on");
    tabAct=btn.dataset.tab;
    document.querySelectorAll(".page").forEach(p=>p.classList.remove("on"));
    document.getElementById(`page-${tabAct}`).classList.add("on");
    if(tabAct==="resumen")  rResumen();
    if(tabAct==="ingresos") rIngresos();
    if(tabAct==="egresos")  rEgresos();
    if(tabAct==="ahorro")   rAhorro();
    if(tabAct==="tc")       rTC();
    if(tabAct==="desglose") rDesglose();
    if(tabAct==="efectivo") rEfectivo();
    if(tabAct==="ajustes")  rAjustes();
  });
});

document.getElementById("selMes").addEventListener("change",e=>{mes=Number(e.target.value);renderAll();});
document.getElementById("selAnio").addEventListener("change",e=>{anio=Number(e.target.value);renderAll();});

// Set selectors to current date on load
document.getElementById("selMes").value=mes;
document.getElementById("selAnio").value=anio;

// Auto-backup diario
const hoy=new Date().toDateString();
const ultimoBackup=localStorage.getItem("fi-last-auto-backup");
if(ultimoBackup!==hoy){
  setTimeout(()=>{
    if(D.ingresos.length>0){
      crearBackup();
      localStorage.setItem("fi-last-auto-backup",hoy);
    }
  },5000);
}
</script>
</body>
</html>
